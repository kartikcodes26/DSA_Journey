<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>DSA Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
    />
    <style>
      :root {
        --bg: #0c0d10;
        --surface: #15161b;
        --surface-hover: #1b1d23;
        --border: #212329;
        --text: #e7e8ec;
        --dim: #86878f;
        --dim-2: #55565e;
        --accent: #7684f0;
        --accent-soft: rgba(118, 132, 240, 0.13);
        --accent-2: #5fc9b8;
        --accent-2-soft: rgba(95, 201, 184, 0.13);
        --accent-3: #ef8fae;
        --accent-3-soft: rgba(239, 143, 174, 0.13);
        --folder: #c9a768;
        --folder-soft: rgba(201, 167, 104, 0.12);
        --danger: #e2664f;
        --danger-soft: rgba(226, 102, 79, 0.12);
        --ok: #4fb06c;
        --ok-soft: rgba(79, 176, 108, 0.13);
        --radius-sm: 8px;
        --radius: 12px;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --heading-font: "Outfit", sans-serif;
        --body-font: "Inter", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;

        /* syntax token palette */
        --tok-comment: #74807a;
        --tok-keyword: #ef8fae;
        --tok-string: #8ad9b5;
        --tok-number: #f0b464;
        --tok-function: #a68bf0;
        --tok-tag: #ef8d75;
        --tok-operator: #74b8e0;
        --tok-variable: #f0b464;
        --tok-punctuation: #8b949e;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--body-font);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        overscroll-behavior-y: none;
      }
      .icon-svg {
        flex-shrink: 0;
        display: block;
      }
      button {
        font-family: inherit;
        appearance: none;
      }

      /* Offline banner */
      #offline-banner {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 500;
        color: #f0b464;
        background: rgba(240, 180, 100, 0.1);
        padding: 8px 16px;
        flex-shrink: 0;
      }
      #offline-banner.show {
        display: flex;
      }

      /* Header */
      header {
        position: relative;
        padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 12px;
        flex-shrink: 0;
        background: var(--bg);
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--border);
      }
      header::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: linear-gradient(
          90deg,
          var(--accent) 0%,
          var(--accent-2) 55%,
          var(--accent-3) 100%
        );
        opacity: 0.55;
      }
      #back-btn {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-sm);
        transition:
          background 0.12s var(--ease),
          border-color 0.12s var(--ease),
          transform 0.1s var(--ease);
      }
      #back-btn.show {
        display: flex;
        animation: fade-in 0.15s var(--ease);
      }
      #back-btn:hover {
        border-color: var(--accent);
      }
      #back-btn:active {
        transform: scale(0.92);
        background: var(--surface-hover);
      }
      .header-text {
        min-width: 0;
        flex: 1;
      }
      #crumb {
        font-size: 12px;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
        margin-bottom: 2px;
      }
      #title {
        font-family: var(--heading-font);
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }
      .header-icon-btn {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        text-decoration: none;
        cursor: pointer;
        transition:
          background 0.12s var(--ease),
          border-color 0.12s var(--ease),
          color 0.12s var(--ease);
      }
      .header-icon-btn:hover {
        border-color: var(--accent);
        color: var(--text);
      }
      .header-icon-btn:active {
        background: var(--surface-hover);
      }
      .header-icon-btn.active {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      /* Search panel */
      #search-panel {
        display: none;
        margin: 4px 16px 8px;
      }
      #search-panel.show {
        display: block;
        animation: fade-in 0.15s var(--ease);
      }
      .search-panel-inner {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        flex-wrap: wrap;
      }
      .search-panel-icon {
        color: var(--accent);
        display: flex;
        flex-shrink: 0;
        margin-left: 2px;
      }
      #search-input {
        flex: 1;
        min-width: 140px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        outline: none;
        transition: border-color 0.12s var(--ease);
      }
      #search-input::placeholder {
        color: var(--dim-2);
      }
      #search-input:focus {
        border-color: var(--accent);
      }
      .mini-btn {
        border: 1px solid rgba(118, 132, 240, 0.35);
        background: var(--accent-soft);
        color: var(--accent);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition:
          background 0.12s var(--ease),
          transform 0.08s var(--ease);
        white-space: nowrap;
      }
      .mini-btn:hover {
        background: rgba(118, 132, 240, 0.22);
      }
      .mini-btn:active {
        transform: scale(0.95);
      }
      .mini-btn.ghost {
        background: var(--bg);
        border-color: var(--border);
        color: var(--dim);
        padding: 8px 9px;
      }
      .mini-btn.ghost:hover {
        border-color: var(--dim-2);
        color: var(--text);
      }
      .result-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--accent-3);
        font-weight: 600;
      }

      /* Views */
      #app {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .view {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 4px 16px calc(20px + env(safe-area-inset-bottom, 0px));
        animation: view-in 0.16s var(--ease);
      }
      @keyframes view-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* List view */
      .card-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        transition:
          background 0.12s var(--ease),
          border-color 0.12s var(--ease),
          box-shadow 0.12s var(--ease),
          transform 0.08s var(--ease);
        opacity: 0;
        animation: row-in 0.22s var(--ease) forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        .row {
          animation: none;
          opacity: 1;
        }
        .view {
          animation: none;
        }
      }
      @keyframes row-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .row:hover {
        border-color: var(--accent);
        background: var(--surface-hover);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .row:active {
        transform: scale(0.988);
      }
      .badge {
        width: 34px;
        height: 34px;
        border-radius: var(--radius-sm);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge.folder {
        background: var(--folder-soft);
        color: var(--folder);
      }
      .lang-badge {
        width: 34px;
        height: 34px;
        border-radius: var(--radius-sm);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .row-info {
        flex: 1;
        min-width: 0;
      }
      .row-name {
        font-weight: 500;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
      }
      .row-sub {
        font-size: 11.5px;
        color: var(--dim);
        margin-top: 2px;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row-sub .dot {
        opacity: 0.5;
      }
      .row-chev {
        color: var(--dim-2);
        flex-shrink: 0;
        display: flex;
        transition: transform 0.12s var(--ease);
      }
      .row:hover .row-chev {
        transform: translateX(1px);
        color: var(--accent);
      }

      .status {
        padding: 32px 4px;
        color: var(--dim);
        font-size: 13.5px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .status.error {
        color: var(--danger);
      }
      .status-icon {
        color: var(--dim-2);
        opacity: 0.8;
      }
      .status.error .status-icon {
        color: var(--danger);
        opacity: 0.85;
      }
      .retry-btn {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 12.5px;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition:
          background 0.12s var(--ease),
          border-color 0.12s var(--ease);
      }
      .retry-btn:hover {
        border-color: var(--accent);
      }
      .retry-btn:active {
        background: var(--surface-hover);
        transform: scale(0.96);
      }
      .empty {
        padding: 56px 20px;
        text-align: center;
        color: var(--dim);
        font-size: 13.5px;
      }
      .empty-icon {
        display: flex;
        justify-content: center;
        margin-bottom: 10px;
        color: var(--dim-2);
      }
      .skeleton-row {
        height: 58px;
        border-radius: var(--radius);
        background: linear-gradient(
          100deg,
          var(--surface) 30%,
          var(--surface-hover) 50%,
          var(--surface) 70%
        );
        background-size: 200% 100%;
        animation: shimmer 1.3s ease-in-out infinite;
        margin-bottom: 6px;
      }
      @keyframes shimmer {
        from {
          background-position: 150% 0;
        }
        to {
          background-position: -50% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton-row {
          animation: none;
          background: var(--surface);
        }
      }

      /* Code view */
      #code-view {
        display: none;
        flex-direction: column;
        padding: 0;
      }
      .filebar {
        padding: 10px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        margin: 4px 16px 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-top: 2px solid var(--accent);
        border-radius: var(--radius);
      }
      .filebar-info {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .filebar-name {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .filebar-dates {
        font-size: 11px;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .filebar-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .icon-btn {
        border: none;
        cursor: pointer;
        font-family: var(--body-font);
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 5px;
        transition:
          background 0.12s var(--ease),
          border-color 0.12s var(--ease),
          transform 0.08s var(--ease),
          color 0.12s var(--ease);
        text-decoration: none;
        white-space: nowrap;
      }
      .icon-btn:hover {
        border-color: var(--accent);
        background: var(--surface-hover);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }
      .icon-btn.copied {
        color: var(--ok);
        border-color: rgba(79, 176, 108, 0.3);
        background: var(--ok-soft);
      }
      #codewrap {
        flex: 1;
        overflow: auto;
        margin: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }

      /* Image view */
      #image-view {
        display: none;
        flex-direction: column;
        padding: 0;
      }
      #imagewrap {
        flex: 1;
        overflow: auto;
        margin: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: #131419;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      #imagewrap img {
        max-width: 100%;
        max-height: 100%;
        border-radius: var(--radius-sm);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        object-fit: contain;
      }
      #imagewrap .status {
        width: 100%;
      }
      pre[class*="language-"] {
        margin: 0;
        min-height: 100%;
        border-radius: var(--radius);
        font-size: 12.5px;
        padding: 14px;
        background: #131419 !important;
      }
      code {
        font-family: var(--mono) !important;
      }

      /* ---- Custom Prism syntax theme (colorful, matches the app's palette) ---- */
      code[class*="language-"],
      pre[class*="language-"] {
        color: #e7e8ec;
        text-shadow: none;
      }
      .token.comment,
      .token.prolog,
      .token.doctype,
      .token.cdata {
        color: var(--tok-comment);
        font-style: italic;
      }
      .token.punctuation {
        color: var(--tok-punctuation);
      }
      .token.namespace {
        opacity: 0.75;
      }
      .token.property,
      .token.tag,
      .token.constant,
      .token.symbol,
      .token.deleted {
        color: var(--tok-tag);
      }
      .token.boolean,
      .token.number {
        color: var(--tok-number);
      }
      .token.selector,
      .token.attr-name,
      .token.string,
      .token.char,
      .token.builtin,
      .token.inserted {
        color: var(--tok-string);
      }
      .token.operator,
      .token.entity,
      .token.url,
      .language-css .token.string,
      .style .token.string {
        color: var(--tok-operator);
      }
      .token.atrule,
      .token.attr-value,
      .token.keyword {
        color: var(--tok-keyword);
        font-weight: 500;
      }
      .token.function,
      .token.class-name {
        color: var(--tok-function);
      }
      .token.regex,
      .token.important,
      .token.variable {
        color: var(--tok-variable);
      }
      .token.important,
      .token.bold {
        font-weight: 600;
      }
      .token.italic {
        font-style: italic;
      }
      .token.entity {
        cursor: help;
      }
      /* Preprocessor directives (e.g. #include) */
      .token.preprocessor {
        color: var(--tok-variable);
      }
      /* Line highlight / selection niceties */
      ::selection {
        background: rgba(118, 132, 240, 0.25);
      }
      pre[class*="language-"] ::selection {
        background: rgba(118, 132, 240, 0.25);
      }

      ::-webkit-scrollbar {
        width: 7px;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2c34;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #34363f;
      }

      /* Footer */
      footer {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
        padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        font-size: 11.5px;
        color: var(--dim-2);
        background: var(--bg);
      }
      .vibe-mark {
        font-family: var(--heading-font);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim-2);
        opacity: 0.45;
        user-select: none;
      }
      .vibe-dot {
        opacity: 0.28;
        font-size: 9px;
      }

      /* Small screens */
      @media (max-width: 380px) {
        #title {
          font-size: 18px;
        }
        .filebar-dates {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="offline-banner">
      You're offline — showing what's already loaded
    </div>
    <header>
      <button id="back-btn" aria-label="Back"></button>
      <div class="header-text">
        <div id="crumb">kartikcodes26</div>
        <div id="title">DSA Journey</div>
      </div>
      <button
        class="header-icon-btn"
        id="search-toggle-btn"
        aria-label="Search by LeetCode problem number"
        title="Search by LeetCode problem number"
      ></button>
      <a
        class="header-icon-btn"
        id="repo-link"
        href="#"
        target="_blank"
        rel="noopener"
        title="Open on GitHub"
      ></a>
    </header>

    <div id="search-panel">
      <div class="search-panel-inner">
        <span class="search-panel-icon" id="search-panel-icon"></span>
        <input
          id="search-input"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="LeetCode problem number, e.g. 789"
          aria-label="LeetCode problem number"
        />
        <button class="mini-btn" id="search-go-btn">Search</button>
        <button
          class="mini-btn ghost"
          id="search-close-btn"
          aria-label="Close search"
        ></button>
      </div>
      <div class="search-panel-inner" style="margin-top: 6px">
        <span class="search-panel-icon" id="token-icon"></span>
        <input
          id="token-input"
          type="password"
          placeholder="GitHub token (optional — higher rate limit)"
          aria-label="GitHub personal access token"
          autocomplete="off"
        />
        <button class="mini-btn" id="token-save-btn">Save</button>
      </div>
    </div>

    <div id="app">
      <div class="view" id="list-view"></div>
      <div class="view" id="code-view">
        <div class="filebar">
          <div class="filebar-info">
            <span class="filebar-name" id="current-path"></span>
            <span class="filebar-dates" id="current-dates"></span>
          </div>
          <div class="filebar-actions">
            <button
              class="icon-btn"
              id="copy-btn"
              aria-label="Copy code"
            ></button>
            <button
              class="icon-btn"
              id="download-btn"
              aria-label="Download file"
            ></button>
            <a
              class="icon-btn"
              id="raw-link"
              href="#"
              target="_blank"
              rel="noopener"
            ></a>
          </div>
        </div>
        <div id="codewrap"></div>
      </div>
      <div class="view" id="image-view">
        <div class="filebar">
          <div class="filebar-info">
            <span class="filebar-name" id="image-path"></span>
            <span class="filebar-dates" id="image-dates"></span>
          </div>
          <div class="filebar-actions">
            <button
              class="icon-btn"
              id="image-download-btn"
              aria-label="Download image"
            ></button>
            <a
              class="icon-btn"
              id="image-raw-link"
              href="#"
              target="_blank"
              rel="noopener"
            ></a>
          </div>
        </div>
        <div id="imagewrap"></div>
      </div>
    </div>

    <footer>
      kartikcodes26 / DSA_Journey
      <span class="vibe-dot" aria-hidden="true">·</span>
      <span class="vibe-mark">Vibe Coded</span>
    </footer>

      // Image file extensions that should open in the image viewer
      const IMAGE_EXTENSIONS = new Set([
        "png",

        "jpeg",
        "gif",
        "svg",

        "cc",
        "c",
        "h",

        "py",
        "java",
        "js",
        "jsx",
        "ts",
        "tsx",
        "go",
        "rs",
        "rb",
        "php",
        "cs",
        "kt",

        "txt",

      ]);

      function rawFileUrl(path) {
        return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH_FALLBACK}/${path
          .split("/")
          .map(encodeURIComponent)
          .join("/")}`;
      }

      function langBadgeSvg(label, color, sizePx = 34) {
        const fontSize = label.length > 3 ? 8.5 : label.length === 3 ? 9.5 : 11;
        return `<svg class="icon-svg" width="${sizePx}" height="${sizePx}" viewBox="0 0 34 34">
          <rect x="0.5" y="0.5" width="33" height="33" rx="9" fill="${color}22" stroke="${color}44" stroke-width="1"/>
          <text x="17" y="17" text-anchor="middle" dominant-baseline="central"
            font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600"
            font-size="${fontSize}" fill="${color}" letter-spacing="-0.3">${label}</text>
        </svg>`;
      }

      function fileIconHtml(name) {
        const ext = name.includes(".")
          ? name.split(".").pop().toLowerCase()
          : name.replace(/^\./, "").toLowerCase();
        const info = LANG_INFO[ext] || DEFAULT_LANG;
        return langBadgeSvg(info.label, info.color);
      }

      function formatDate(iso) {
        if (!iso) return null;
        const d = new Date(iso);
        if (isNaN(d)) return null;
        return d.toLocaleDateString("en-US", {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function formatBytes(bytes) {
        if (bytes == null) return "";
        if (bytes < 1024) return `${bytes} B`;
        return `${(bytes / 1024).toFixed(1)} KB`;
      }
      // ------------------------------------

      const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
      const repoLink = document.getElementById("repo-link");
      repoLink.href = `https://github.com/${OWNER}/${REPO}`;
      repoLink.innerHTML = icon("external", 16);

      const listView = document.getElementById("list-view");
      const codeView = document.getElementById("code-view");
      const imageView = document.getElementById("image-view");
      const backBtn = document.getElementById("back-btn");
      const crumbEl = document.getElementById("crumb");
      const titleEl = document.getElementById("title");
      const currentPathEl = document.getElementById("current-path");
      const currentDatesEl = document.getElementById("current-dates");
      const rawLinkEl = document.getElementById("raw-link");
      const codewrap = document.getElementById("codewrap");
      const copyBtn = document.getElementById("copy-btn");
      const downloadBtn = document.getElementById("download-btn");
      const offlineBanner = document.getElementById("offline-banner");
      const imagePathEl = document.getElementById("image-path");
      const imageDatesEl = document.getElementById("image-dates");
      const imageRawLinkEl = document.getElementById("image-raw-link");
      const imageDownloadBtn = document.getElementById("image-download-btn");
      const imagewrap = document.getElementById("imagewrap");

      const searchToggleBtn = document.getElementById("search-toggle-btn");
      const searchPanel = document.getElementById("search-panel");
      const searchPanelIcon = document.getElementById("search-panel-icon");
      const searchInput = document.getElementById("search-input");
      const searchGoBtn = document.getElementById("search-go-btn");
      const searchCloseBtn = document.getElementById("search-close-btn");
      const tokenIcon = document.getElementById("token-icon");
      const tokenInput = document.getElementById("token-input");
      const tokenSaveBtn = document.getElementById("token-save-btn");

      backBtn.innerHTML = icon("back", 18);
      copyBtn.innerHTML = icon("copy", 14) + " Copy";
      downloadBtn.innerHTML = icon("download", 14) + " Save";
      rawLinkEl.innerHTML = icon("external", 12) + " Raw";
      imageDownloadBtn.innerHTML = icon("download", 14) + " Save";
      imageRawLinkEl.innerHTML = icon("external", 12) + " Raw";
      searchToggleBtn.innerHTML = icon("search", 16);
      searchPanelIcon.innerHTML = icon("search", 15);
      searchCloseBtn.innerHTML = icon("x", 13);
      tokenIcon.innerHTML = icon("check", 15);

      // ---- GitHub token (stored locally, used to authenticate API calls) ----
      const TOKEN_STORAGE_KEY = "gh_token";
      let githubToken = localStorage.getItem(TOKEN_STORAGE_KEY) || "";
      if (githubToken) tokenInput.value = githubToken;

      function saveToken() {
        const val = tokenInput.value.trim();
        githubToken = val;
        if (val) {
          localStorage.setItem(TOKEN_STORAGE_KEY, val);
          flashButton(tokenSaveBtn, "check", "Saved");
        } else {
          localStorage.removeItem(TOKEN_STORAGE_KEY);
          flashButton(tokenSaveBtn, "check", "Cleared");
        }
      }
      tokenSaveBtn.addEventListener("click", saveToken);
      tokenInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          saveToken();
        }
      });

      function authHeaders(extra = {}) {
        const headers = { ...extra };
        if (githubToken) headers.Authorization = `token ${githubToken}`;
        return headers;
      }
      // ---------------------------------------------------------------

      let currentCode = "";
      let currentFileName = "";
      let activeController = null; // aborts stale in-flight requests

      function setOnlineStatus() {
        offlineBanner.classList.toggle("show", !navigator.onLine);
      }
      window.addEventListener("online", () => {
        setOnlineStatus();
        const top = stack[stack.length - 1];
        if (typeof top === "string") renderFolder(top);
      });
      window.addEventListener("offline", setOnlineStatus);
      setOnlineStatus();

      copyBtn.addEventListener("click", async () => {
        if (!currentCode) return;
        try {
          await navigator.clipboard.writeText(currentCode);
          flashButton(copyBtn, "check", "Copied");
        } catch (err) {
          flashButton(copyBtn, "x", "Failed");
        }
      });

      downloadBtn.addEventListener("click", () => {
        if (!currentCode) return;
        try {
          const blob = new Blob([currentCode], {
            type: "text/plain;charset=utf-8",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = currentFileName || "file.txt";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          flashButton(downloadBtn, "check", "Saved");
        } catch (err) {
          flashButton(downloadBtn, "x", "Failed");
        }
      });

      let currentImageUrl = "";
      let currentImageName = "";

      imageDownloadBtn.addEventListener("click", () => {
        if (!currentImageUrl) return;
        try {
          const a = document.createElement("a");
          a.href = currentImageUrl;
          a.download = currentImageName || "image.png";
          a.target = "_blank";
          a.rel = "noopener";
          document.body.appendChild(a);
          a.click();
          a.remove();
          flashButton(imageDownloadBtn, "check", "Saved");
        } catch (err) {
          flashButton(imageDownloadBtn, "x", "Failed");
        }
      });

      function flashButton(btn, iconName, label) {
        const original = btn.innerHTML;
        btn.classList.add("copied");
        btn.innerHTML = icon(iconName, 14) + " " + label;
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = original;
        }, 1800);
      }

      const LANG_MAP = {
        js: "javascript",
        jsx: "jsx",
        ts: "typescript",
        tsx: "tsx",
        py: "python",
        java: "java",
        cpp: "cpp",
        cc: "cpp",
        c: "c",
        h: "c",
        hpp: "cpp",
        cs: "csharp",
        go: "go",
        rs: "rust",
        rb: "ruby",
        php: "php",
        html: "markup",
        htm: "markup",
        xml: "markup",
        css: "css",
        json: "json",
        md: "markdown",
        sh: "bash",
        bash: "bash",
        yml: "yaml",
        yaml: "yaml",
        sql: "sql",
        kt: "kotlin",
        swift: "swift",
        txt: "none",
        gitignore: "none",
      };

      // navigation stack: array of path strings ('' = root), {__file:true} markers,
      // or {__search:true} markers for the LeetCode-search results view
      let stack = [""];

      async function fetchWithTimeout(url, opts = {}) {
        const controller = new AbortController();
        activeController = controller;
        const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
        try {
          const res = await fetch(url, { ...opts, signal: controller.signal });
          return res;
        } finally {
          clearTimeout(timeout);
        }
      }

      async function ghFetch(path) {
        let res;
        try {
          res = await fetchWithTimeout(`${API}/contents/${encodeURI(path)}`, {
            headers: authHeaders({ Accept: "application/vnd.github+json" }),
          });
        } catch (err) {
          if (err.name === "AbortError") {
            throw new Error("Request timed out — check your connection.");
          }
          throw new Error("Couldn't reach GitHub. Check your connection.");
        }
        if (!res.ok) {
          if (res.status === 403 || res.status === 429) {
            const remaining = res.headers.get("x-ratelimit-remaining");
            const reset = res.headers.get("x-ratelimit-reset");
            if (remaining === "0" && reset) {
              const waitSec = Math.max(
                0,
                Math.ceil(Number(reset) - Date.now() / 1000),
              );
              const mins = Math.ceil(waitSec / 60);
              throw new Error(
                `Rate limited by GitHub — try again in about ${mins} minute${mins === 1 ? "" : "s"}.`,
              );
            }
            throw new Error("Too many requests right now — try again shortly.");
          }
          if (res.status === 404) throw new Error("Couldn't find that.");
          throw new Error(`Something went wrong (${res.status}).`);
        }
        return res.json();
      }

      function showList() {
        codeView.style.display = "none";
        imageView.style.display = "none";
        listView.style.display = "block";
      }
      function showCode() {
        listView.style.display = "none";
        imageView.style.display = "none";
        codeView.style.display = "flex";
      }
      function showImage() {
        listView.style.display = "none";
        codeView.style.display = "none";
        imageView.style.display = "flex";
      }

      function updateHeader(path) {
        backBtn.classList.toggle("show", stack.length > 1);
        crumbEl.textContent = path === "" ? OWNER : path.split("/").join(" / ");
        titleEl.textContent = path === "" ? REPO : path.split("/").pop();
      }

      function renderSkeleton() {
        listView.innerHTML = "";
        const wrap = document.createElement("div");
        for (let i = 0; i < 6; i++) {
          const s = document.createElement("div");
          s.className = "skeleton-row";
          wrap.appendChild(s);
        }
        listView.appendChild(wrap);
      }

      function errorStatus(message, onRetry) {
        const el = document.createElement("div");
        el.className = "status error";
        el.innerHTML = `<span class="status-icon">${icon(
          navigator.onLine ? "alert" : "wifiOff",
          26,
        )}</span><span>${message}</span>`;
        const btn = document.createElement("button");
        btn.className = "retry-btn";
        btn.textContent = "Try again";
        btn.addEventListener("click", onRetry);
        el.appendChild(btn);
        return el;
      }

      async function renderFolder(path) {
        showList();
        updateHeader(path);
        renderSkeleton();
        try {
          const items = await ghFetch(path);
          if (!Array.isArray(items)) {
            listView.innerHTML = "";
            listView.appendChild(
              errorStatus("That doesn't look like a folder.", () =>
                renderFolder(path),
              ),
            );
            return;
          }
          const visible = items.filter(
            (item) => !HIDDEN_PATTERNS.some((re) => re.test(item.name)),
          );
          if (visible.length === 0) {
            listView.innerHTML = `<div class="empty"><span class="empty-icon">${icon("emptyFolder", 30)}</span>Nothing to see here.</div>`;
            return;
          }
          const sorted = [...visible].sort((a, b) => {
            if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
            return a.name.localeCompare(b.name);
          });
          const list = document.createElement("div");
          list.className = "card-list";
          sorted.forEach((item, i) => {
            const row = document.createElement("div");
            row.className = "row";
            row.style.animationDelay = `${Math.min(i, 10) * 18}ms`;
            const createdLabel = formatDate(item.created_at);
            const updatedLabel = formatDate(item.updated_at);
            const dateBits = [];
            if (createdLabel) dateBits.push(`Created ${createdLabel}`);
            if (updatedLabel) dateBits.push(`Modified ${updatedLabel}`);

            if (item.type === "dir") {
              row.innerHTML = `
          <div class="badge folder">${icon("folder", 18)}</div>
          <div class="row-info">
            <div class="row-name">${escapeHtml(item.name)}</div>
            <div class="row-sub">Folder${dateBits.length ? `<span class="dot">·</span>${dateBits.join(" · ")}` : ""}</div>
          </div>
          <div class="row-chev">${icon("chevron", 15)}</div>`;
              row.addEventListener("click", () => {
                stack.push(item.path);
                renderFolder(item.path);
              });
            } else {
              const sizeLabel = formatBytes(item.size);
              row.innerHTML = `
          <div class="badge">${fileIconHtml(item.name)}</div>
          <div class="row-info">
            <div class="row-name">${escapeHtml(item.name)}</div>
            <div class="row-sub">${sizeLabel}${dateBits.length ? `<span class="dot">·</span>${dateBits.join(" · ")}` : ""}</div>
          </div>
          <div class="row-chev">${icon("chevron", 15)}</div>`;
              row.addEventListener("click", () => openFile(item));
            }
            list.appendChild(row);
          });
          listView.innerHTML = "";
          listView.appendChild(list);
        } catch (err) {
          listView.innerHTML = "";
          listView.appendChild(
            errorStatus(err.message, () => renderFolder(path)),
          );
        }
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      async function fetchFileContent(item) {
        // Prefer the direct download_url; fall back to the git blob API
        // for large files where GitHub omits download_url.
        if (item.download_url) {
          const res = await fetchWithTimeout(item.download_url);
          if (!res.ok)
            throw new Error(`Couldn't load this file (${res.status}).`);
          return res.text();
        }
        if (item.path) {
          const res = await fetchWithTimeout(rawFileUrl(item.path));
          if (res.ok) return res.text();
        }
        if (item.git_url) {
          const res = await fetchWithTimeout(item.git_url, {
            headers: { Accept: "application/vnd.github+json" },
          });
          if (!res.ok)
            throw new Error(`Couldn't load this file (${res.status}).`);
          const data = await res.json();
          if (data.encoding === "base64") {
            return decodeURIComponent(
              atob(data.content.replace(/\n/g, ""))
                .split("")
                .map((c) => "%" + c.charCodeAt(0).toString(16).padStart(2, "0"))
                .join(""),
            );
          }
          return data.content || "";
        }
        throw new Error("This file can't be previewed.");
      }

      function isImageFile(name) {
        const ext = name.includes(".")
          ? name.split(".").pop().toLowerCase()
          : "";
        return IMAGE_EXTENSIONS.has(ext);
      }

      async function openImage(item) {
        showImage();
        backBtn.classList.add("show");
        crumbEl.textContent =
          item.path.split("/").slice(0, -1).join(" / ") || OWNER;
        titleEl.textContent = item.name;
        imagePathEl.textContent = item.name;
        currentImageName = item.name;
        const createdLabel = formatDate(item.created_at);
        const updatedLabel = formatDate(item.updated_at);
        imageDatesEl.textContent = [
          createdLabel ? `Created ${createdLabel}` : null,
          updatedLabel ? `Modified ${updatedLabel}` : null,
        ]
          .filter(Boolean)
          .join(" · ");
        imageRawLinkEl.href =
          item.html_url ||
          `https://github.com/${OWNER}/${REPO}/blob/${BRANCH_FALLBACK}/${item.path}`;
        imagewrap.innerHTML = `<div class="status">Loading ${escapeHtml(item.name)}…</div>`;
        currentImageUrl = "";

        try {
          const url = item.download_url;
          if (!url) throw new Error("This image can't be previewed.");
          currentImageUrl = url;

          const img = document.createElement("img");
          img.alt = item.name;
          img.onload = () => {
            imagewrap.innerHTML = "";
            imagewrap.appendChild(img);
          };
          img.onerror = () => {
            imagewrap.innerHTML = "";
            const wrap = document.createElement("div");
            wrap.style.padding = "8px";
            wrap.appendChild(
              errorStatus("Couldn't load this image.", () => openImage(item)),
            );
            imagewrap.appendChild(wrap);
          };
          img.src = url;

          stack.push({ __file: true });
        } catch (err) {
          imagewrap.innerHTML = "";
          const wrap = document.createElement("div");
          wrap.style.padding = "8px";
          wrap.appendChild(
            errorStatus(err.message || "Couldn't load this image.", () =>
              openImage(item),
            ),
          );
          imagewrap.appendChild(wrap);
        }
      }

      async function openFile(item) {
        if (isImageFile(item.name)) {
          await openImage(item);
          return;
        }
        showCode();
        backBtn.classList.add("show");
        crumbEl.textContent =
          item.path.split("/").slice(0, -1).join(" / ") || OWNER;
        titleEl.textContent = item.name;
        currentPathEl.textContent = item.name;
        currentFileName = item.name;
        const createdLabel = formatDate(item.created_at);
        const updatedLabel = formatDate(item.updated_at);
        currentDatesEl.textContent = [
          createdLabel ? `Created ${createdLabel}` : null,
          updatedLabel ? `Modified ${updatedLabel}` : null,
        ]
          .filter(Boolean)
          .join(" · ");
        rawLinkEl.href =
          item.html_url ||
          `https://github.com/${OWNER}/${REPO}/blob/${BRANCH_FALLBACK}/${item.path}`;
        codewrap.innerHTML = `<div class="status">Loading ${escapeHtml(item.name)}…</div>`;
        currentCode = "";

        try {
          const text = await fetchFileContent(item);
          currentCode = text;

          const ext = item.name.includes(".")
            ? item.name.split(".").pop().toLowerCase()
            : "";
          const lang = LANG_MAP[ext] || "none";

          const pre = document.createElement("pre");
          pre.className = `language-${lang}`;
          const code = document.createElement("code");
          code.className = `language-${lang}`;
          code.textContent = text;
          pre.appendChild(code);

          codewrap.innerHTML = "";
          codewrap.appendChild(pre);
          if (lang !== "none") {
            try {
              Prism.highlightElement(code);
            } catch (e) {
              // Highlighting is best-effort; raw text is already visible.
            }
          }

          stack.push({ __file: true });
        } catch (err) {
          codewrap.innerHTML = "";
          const wrap = document.createElement("div");
          wrap.style.padding = "8px";
          wrap.appendChild(
            errorStatus(err.message || "Couldn't load this file.", () =>
              openFile(item),
            ),
          );
          codewrap.appendChild(wrap);
        }
      }

      // ---- LeetCode problem-number search ----
      // Code Search (/search/code) requires auth and is blocked by CORS in
      // the browser. Instead: one recursive git-tree request, then scan
      // file heads from raw.githubusercontent.com (CORS-friendly, no token).
      const INDEX_STORAGE_KEY = "gh_problem_index_v2";
      const PROBLEM_NO_RES = [
        /leet\s*code\s*(?:problem\s*)?(?:no\.?|nos\.?|number|#)?\s*:?\s*(\d+)/gi,
        /problem\s*(?:no\.?|nos\.?|number|#)\s*:?\s*(\d+)/gi,
        /\bLC\s*#?\s*:?\s*(\d+)/gi,
      ];

      function extractProblemNumbers(text) {
        const nums = new Set();
        const head = text.slice(0, 4000);
        for (const re of PROBLEM_NO_RES) {
          re.lastIndex = 0;
          let m;
          while ((m = re.exec(head)) !== null) nums.add(m[1]);
        }
        return [...nums];
      }
      const INDEX_CONCURRENCY = 8;
      let problemIndex = null; // { sha, files: [{ name, path, problemNos }] }
      let lastSearchQuery = "";
      let lastSearchResults = [];

      function openSearchPanel() {
        searchPanel.classList.add("show");
        searchToggleBtn.classList.add("active");
        searchInput.focus();
      }
      function closeSearchPanel() {
        searchPanel.classList.remove("show");
        searchToggleBtn.classList.remove("active");
      }

      searchToggleBtn.addEventListener("click", () => {
        if (searchPanel.classList.contains("show")) {
          closeSearchPanel();
        } else {
          openSearchPanel();
        }
      });
      searchCloseBtn.addEventListener("click", closeSearchPanel);
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          triggerSearch();
        } else if (e.key === "Escape") {
          closeSearchPanel();
        }
      });
      searchGoBtn.addEventListener("click", triggerSearch);

      function triggerSearch() {
        const num = searchInput.value.replace(/[^0-9]/g, "").trim();
        if (!num) {
          searchInput.focus();
          return;
        }
        closeSearchPanel();
        runSearch(num);
      }

      async function fetchRepoTree() {
        let res;
        try {
          res = await fetchWithTimeout(
            `${API}/git/trees/${encodeURIComponent(BRANCH_FALLBACK)}?recursive=1`,
            { headers: authHeaders({ Accept: "application/vnd.github+json" }) },
          );
        } catch (err) {
          if (err.name === "AbortError") {
            throw new Error("Request timed out — check your connection.");
          }
          throw new Error("Couldn't reach GitHub. Check your connection.");
        }
        if (!res.ok) {
          if (res.status === 403 || res.status === 429) {
            throw new Error("Too many requests right now — try again shortly.");
          }
          if (res.status === 404) throw new Error("Couldn't find that.");
          throw new Error(`Something went wrong (${res.status}).`);
        }
        return res.json();
      }

      async function mapPool(items, limit, fn) {
        const results = new Array(items.length);
        let next = 0;
        async function worker() {
          while (next < items.length) {
            const i = next++;
            results[i] = await fn(items[i]);
          }
        }
        const n = Math.min(limit, items.length);
        await Promise.all(Array.from({ length: n }, () => worker()));
        return results;
      }

      function readCachedIndex() {
        try {
          const cached = JSON.parse(
            localStorage.getItem(INDEX_STORAGE_KEY) || "null",
          );
          if (cached && cached.sha && Array.isArray(cached.files)) return cached;
        } catch (e) {
          // ignore bad cache
        }
        return null;
      }

      async function ensureProblemIndex(onProgress) {
        if (problemIndex) return problemIndex;

        const tree = await fetchRepoTree();
        const cached = readCachedIndex();
        if (cached && cached.sha === tree.sha) {
          problemIndex = cached;
          return problemIndex;
        }

        const blobs = (tree.tree || []).filter((node) => {
          if (node.type !== "blob") return false;
          const name = node.path.split("/").pop();
          if (HIDDEN_PATTERNS.some((re) => re.test(name))) return false;
          const ext = name.includes(".")
            ? name.split(".").pop().toLowerCase()
            : "";
          return SEARCHABLE_EXT.has(ext);
        });

        if (onProgress) onProgress(0, blobs.length);

        let done = 0;
        const files = [];
        await mapPool(blobs, INDEX_CONCURRENCY, async (node) => {
          try {
            const res = await fetchWithTimeout(rawFileUrl(node.path));
            if (!res.ok) return;
            const text = await res.text();
            const problemNos = extractProblemNumbers(text);
            if (problemNos.length) {
              files.push({
                name: node.path.split("/").pop(),
                path: node.path,
                problemNos,
              });
            }
          } catch (e) {
            // skip files that fail to load
          } finally {
            done += 1;
            if (onProgress) onProgress(done, blobs.length);
          }
        });

        problemIndex = { sha: tree.sha, files };
        try {
          localStorage.setItem(INDEX_STORAGE_KEY, JSON.stringify(problemIndex));
        } catch (e) {
          // quota / private mode
        }
        return problemIndex;
      }

      async function runSearch(num) {
        showList();
        stack.push({ __search: true });
        backBtn.classList.add("show");
        crumbEl.textContent = "Search results";
        titleEl.textContent = `LeetCode #${num}`;
        renderSkeleton();
        lastSearchQuery = num;
        try {
          const index = await ensureProblemIndex((done, total) => {
            if (!total) return;
            titleEl.textContent = `Indexing files… ${done}/${total}`;
          });
          lastSearchResults = index.files.filter((item) =>
            (item.problemNos || []).includes(String(num)),
          );
          renderSearchResults(num, lastSearchResults);
        } catch (err) {
          titleEl.textContent = `LeetCode #${num}`;
          listView.innerHTML = "";
          listView.appendChild(
            errorStatus(err.message || "Couldn't search right now.", () =>
              runSearch(num),
            ),
          );
        }
      }

      function renderSearchResults(num, items) {
        showList();
        crumbEl.textContent = "Search results";
        titleEl.textContent = `LeetCode #${num}`;
        backBtn.classList.add("show");
        if (!items.length) {
          listView.innerHTML = `<div class="empty"><span class="empty-icon">${icon("emptyFolder", 30)}</span>No files tagged with LeetCode problem #${escapeHtml(num)}.</div>`;
          return;
        }
        const list = document.createElement("div");
        list.className = "card-list";
        items.forEach((item, i) => {
          const row = document.createElement("div");
          row.className = "row";
          row.style.animationDelay = `${Math.min(i, 10) * 18}ms`;
          const dirPath = item.path.split("/").slice(0, -1).join(" / ");
          row.innerHTML = `
          <div class="badge">${fileIconHtml(item.name)}</div>
          <div class="row-info">
            <div class="row-name">${escapeHtml(item.name)}</div>
            <div class="row-sub">${dirPath ? escapeHtml(dirPath) : OWNER}<span class="dot">·</span><span class="result-tag">${icon("search", 11)} #${escapeHtml(num)}</span></div>
          </div>
          <div class="row-chev">${icon("chevron", 15)}</div>`;
          row.addEventListener("click", () => openSearchResult(item));
          list.appendChild(row);
        });
        listView.innerHTML = "";
        listView.appendChild(list);
      }

      async function openSearchResult(item) {
        await openFile({
          name: item.name,
          path: item.path,
          download_url: rawFileUrl(item.path),
          html_url: `https://github.com/${OWNER}/${REPO}/blob/${BRANCH_FALLBACK}/${item.path}`,
        });
      }
      // ---- end search ----

      backBtn.addEventListener("click", () => {
        if (stack.length <= 1) return;
        stack.pop();
        const top = stack[stack.length - 1];
        if (typeof top === "string") {
          renderFolder(top);
        } else if (top && top.__search) {
          renderSearchResults(lastSearchQuery, lastSearchResults);
        }
      });

      window.addEventListener("error", (e) => {
        // Swallow stray script errors (e.g. from CDN hiccups) so the UI
        // doesn't get stuck on a blank screen.
        console.error("Unhandled error:", e.error || e.message);
      });

      renderFolder("");
    </script>
  </body>
</html>
