<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>DSA Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
    />
    <style>
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --border: #2a2e3d;
        --text: #e4e6ef;
        --dim: #8a90a6;
        --accent: #8b7cf7;
        --accent-soft: rgba(108, 92, 231, 0.16);
        --folder: #ffb258;
        --folder-soft: rgba(255, 178, 88, 0.12);
        --file: #4fb0c6;
        --file-soft: rgba(79, 176, 198, 0.12);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.45);
        --heading-font: "Outfit", sans-serif;
        --body-font: "Inter", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--body-font);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .icon-svg {
        flex-shrink: 0;
        display: block;
      }

      /* Header */
      header {
        padding: 18px 18px 14px;
        flex-shrink: 0;
        background: var(--bg);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #back-btn {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        border: none;
        background: var(--surface);
        box-shadow: var(--shadow);
        color: var(--accent);
        font-size: 18px;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
      }
      #back-btn.show {
        display: flex;
      }
      #back-btn:active {
        transform: scale(0.94);
      }
      .header-text {
        min-width: 0;
        flex: 1;
      }
      #crumb {
        font-size: 12px;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
        margin-bottom: 2px;
      }
      #title {
        font-family: var(--heading-font);
        font-size: 22px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: -0.01em;
      }
      .repo-link {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--dim);
        text-decoration: none;
        font-size: 16px;
      }

      /* Views */
      #app {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .view {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 4px 16px 24px;
      }

      /* List view — friendly cards */
      .card-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 13px 14px;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow);
        cursor: pointer;
      }
      .row:active {
        transform: scale(0.985);
        background: #20242f;
      }
      .badge {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge.folder {
        background: var(--folder-soft);
        color: var(--folder);
      }
      .badge.file {
        background: var(--file-soft);
        color: var(--file);
      }
      .row-info {
        flex: 1;
        min-width: 0;
      }
      .row-name {
        font-weight: 600;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
      }
      .row-sub {
        font-size: 12px;
        color: var(--dim);
        margin-top: 1px;
      }
      .row-sub.date {
        font-size: 11px;
        color: var(--dim);
        opacity: 0.7;
        margin-top: 2px;
      }
      .row-chev {
        color: var(--dim);
        flex-shrink: 0;
        display: flex;
      }

      .status {
        padding: 24px 4px;
        color: var(--dim);
        font-size: 14px;
        text-align: center;
      }
      .status.error {
        color: #ff6b4a;
      }
      .empty {
        padding: 48px 20px;
        text-align: center;
        color: var(--dim);
        font-size: 14px;
      }
      .empty-icon {
        display: flex;
        justify-content: center;
        margin-bottom: 8px;
        color: var(--dim);
      }

      /* Code view */
      #code-view {
        display: none;
        flex-direction: column;
        padding: 0;
      }
      .filebar {
        padding: 10px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        margin: 4px 16px 8px;
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }
      .filebar-info {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .filebar-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .filebar-dates {
        font-size: 11px;
        color: var(--dim);
        opacity: 0.7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .filebar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .filebar a {
        color: var(--accent);
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        background: var(--accent-soft);
        padding: 5px 10px;
        border-radius: 8px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .copy-btn {
        border: none;
        cursor: pointer;
        font-family: var(--body-font);
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 5px 10px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 4px;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .copy-btn:hover {
        background: rgba(108, 92, 231, 0.25);
      }
      .copy-btn:active {
        transform: scale(0.95);
      }
      .copy-btn.copied {
        background: rgba(46, 160, 67, 0.2);
        color: #3fb950;
      }
      #codewrap {
        flex: 1;
        overflow: auto;
        margin: 0 16px 16px;
        border-radius: 16px;
        box-shadow: var(--shadow);
      }
      pre[class*="language-"] {
        margin: 0;
        min-height: 100%;
        border-radius: 16px;
        font-size: 13px;
        padding: 16px;
        background: #171a21 !important;
      }
      code {
        font-family: var(--mono) !important;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #3a3f52;
        border-radius: 4px;
      }

      /* Footer */
      footer {
        flex-shrink: 0;
        text-align: center;
        padding: 10px 16px 14px;
        font-size: 12px;
        color: var(--dim);
        background: var(--bg);
      }
      footer .vibe {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="back-btn" aria-label="Back"></button>
      <div class="header-text">
        <div id="crumb">kartikcodes26</div>
        <div id="title">DSA Journey</div>
      </div>
      <a
        class="repo-link"
        id="repo-link"
        href="#"
        target="_blank"
        rel="noopener"
        title="Open on GitHub"
      ></a>
    </header>

    <div id="app">
      <div class="view" id="list-view"></div>
      <div class="view" id="code-view">
        <div class="filebar">
          <div class="filebar-info">
            <span class="filebar-name" id="current-path"></span>
            <span class="filebar-dates" id="current-dates"></span>
          </div>
          <div class="filebar-actions">
            <button
              class="copy-btn"
              id="copy-btn"
              aria-label="Copy code"
            ></button>
            <a id="raw-link" href="#" target="_blank" rel="noopener"></a>
          </div>
        </div>
        <div id="codewrap"></div>
      </div>
    </div>

    <footer>
      <span class="vibe"></span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script>
      Prism.plugins.autoloader.languages_path =
        "https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/";

      // ---- Config ----
      const OWNER = "kartikcodes26";
      const REPO = "DSA_Journey";
      const BRANCH_FALLBACK = "main";

      // Files matching these patterns are hidden from the listing
      const HIDDEN_PATTERNS = [
        /^\./, // dotfiles (.gitignore, .prettierrc, etc.)
        /^tempCodeRunnerFile/, // VS Code Code Runner temp files
        /^index\.html$/,
        /^README\.md$/,
      ];
      // ----------------

      // ---- SVG Icons (feather-style) ----
      const ICON_PATHS = {
        back: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
        external:
          '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
        folder:
          '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
        file: '<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>',
        cpp: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
        py: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
        html: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
        txt: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>',
        chevron: '<polyline points="9 18 15 12 9 6"/>',
        copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
        check: '<polyline points="20 6 9 17 4 12"/>',
        x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
        bolt: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
        emptyFolder:
          '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
      };

      function icon(name, size = 18) {
        return `<svg class="icon-svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]}</svg>`;
      }

      function fileIcon(name) {
        const ext = name.split(".").pop().toLowerCase();
        if (["cpp", "cc", "c", "h", "hpp"].includes(ext))
          return icon("cpp", 20);
        if (["py"].includes(ext)) return icon("py", 20);
        if (["html", "htm", "xml", "css", "js", "ts", "json"].includes(ext))
          return icon("html", 20);
        if (["txt", "md"].includes(ext)) return icon("txt", 20);
        return icon("file", 20);
      }

      function formatDate(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (isNaN(d)) return "—";
        return d.toLocaleDateString("en-US", {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }
      // ------------------------------------

      const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
      const repoLink = document.getElementById("repo-link");
      repoLink.href = `https://github.com/${OWNER}/${REPO}`;
      repoLink.innerHTML = icon("external", 16);

      const listView = document.getElementById("list-view");
      const codeView = document.getElementById("code-view");
      const backBtn = document.getElementById("back-btn");
      const crumbEl = document.getElementById("crumb");
      const titleEl = document.getElementById("title");
      const currentPathEl = document.getElementById("current-path");
      const currentDatesEl = document.getElementById("current-dates");
      const rawLinkEl = document.getElementById("raw-link");
      const codewrap = document.getElementById("codewrap");
      const copyBtn = document.getElementById("copy-btn");

      backBtn.innerHTML = icon("back", 18);
      copyBtn.innerHTML = icon("copy", 14) + " Copy";
      rawLinkEl.innerHTML = icon("external", 12) + " View raw";
      document.querySelector(".vibe").innerHTML =
        icon("bolt", 12) + " vibe coded";

      let currentCode = "";

      copyBtn.addEventListener("click", async () => {
        if (!currentCode) return;
        try {
          await navigator.clipboard.writeText(currentCode);
          copyBtn.classList.add("copied");
          copyBtn.innerHTML = icon("check", 14) + " Copied!";
          setTimeout(() => {
            copyBtn.classList.remove("copied");
            copyBtn.innerHTML = icon("copy", 14) + " Copy";
          }, 2000);
        } catch (err) {
          copyBtn.innerHTML = icon("x", 14) + " Failed";
          setTimeout(() => {
            copyBtn.innerHTML = icon("copy", 14) + " Copy";
          }, 2000);
        }
      });

      const LANG_MAP = {
        js: "javascript",
        ts: "typescript",
        py: "python",
        java: "java",
        cpp: "cpp",
        cc: "cpp",
        c: "c",
        h: "c",
        hpp: "cpp",
        cs: "csharp",
        go: "go",
        rs: "rust",
        rb: "ruby",
        php: "php",
        html: "markup",
        htm: "markup",
        xml: "markup",
        css: "css",
        json: "json",
        md: "markdown",
        sh: "bash",
        yml: "yaml",
        yaml: "yaml",
        sql: "sql",
        kt: "kotlin",
        swift: "swift",
        txt: "none",
        gitignore: "none",
      };

      // navigation stack: array of path strings, '' = root
      let stack = [""];

      async function ghFetch(path) {
        const res = await fetch(`${API}/contents/${path}`);
        if (!res.ok) {
          if (res.status === 403)
            throw new Error(
              "Too many requests right now — give it a minute and try again.",
            );
          if (res.status === 404) throw new Error("Couldn't find that.");
          throw new Error(`Something went wrong (${res.status}).`);
        }
        return res.json();
      }

      function showList() {
        codeView.style.display = "none";
        listView.style.display = "block";
      }
      function showCode() {
        listView.style.display = "none";
        codeView.style.display = "flex";
      }

      function updateHeader(path) {
        backBtn.classList.toggle("show", stack.length > 1);
        crumbEl.textContent = path === "" ? OWNER : path.split("/").join(" / ");
        titleEl.textContent = path === "" ? REPO : path.split("/").pop();
      }

      async function renderFolder(path) {
        showList();
        updateHeader(path);
        listView.innerHTML = `<div class="status">Loading…</div>`;
        try {
          const items = await ghFetch(path);
          if (!Array.isArray(items)) {
            listView.innerHTML = `<div class="status error">That doesn't look like a folder.</div>`;
            return;
          }
          const visible = items.filter(
            (item) => !HIDDEN_PATTERNS.some((re) => re.test(item.name)),
          );
          if (visible.length === 0) {
            listView.innerHTML = `<div class="empty"><span class="empty-icon">${icon("emptyFolder", 32)}</span>Nothing to see here.</div>`;
            return;
          }
          const sorted = [...visible].sort((a, b) => {
            if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
            return a.name.localeCompare(b.name);
          });
          const list = document.createElement("div");
          list.className = "card-list";
          for (const item of sorted) {
            const row = document.createElement("div");
            row.className = "row";
            if (item.type === "dir") {
              row.innerHTML = `
          <div class="badge folder">${icon("folder", 20)}</div>
          <div class="row-info">
            <div class="row-name">${item.name}</div>
            <div class="row-sub">Folder</div>
            <div class="row-sub date">Created ${formatDate(item.created_at)} · Modified ${formatDate(item.updated_at)}</div>
          </div>
          <div class="row-chev">${icon("chevron", 16)}</div>`;
              row.addEventListener("click", () => {
                stack.push(item.path);
                renderFolder(item.path);
              });
            } else {
              row.innerHTML = `
          <div class="badge file">${fileIcon(item.name)}</div>
          <div class="row-info">
            <div class="row-name">${item.name}</div>
            <div class="row-sub">${(item.size / 1024).toFixed(1)} KB</div>
            <div class="row-sub date">Created ${formatDate(item.created_at)} · Modified ${formatDate(item.updated_at)}</div>
          </div>
          <div class="row-chev">${icon("chevron", 16)}</div>`;
              row.addEventListener("click", () => openFile(item));
            }
            list.appendChild(row);
          }
          listView.innerHTML = "";
          listView.appendChild(list);
        } catch (err) {
          listView.innerHTML = `<div class="status error">${err.message}</div>`;
        }
      }

      async function openFile(item) {
        showCode();
        backBtn.classList.add("show");
        crumbEl.textContent =
          item.path.split("/").slice(0, -1).join(" / ") || OWNER;
        titleEl.textContent = item.name;
        currentPathEl.textContent = item.name;
        currentDatesEl.textContent = `Created ${formatDate(item.created_at)} · Modified ${formatDate(item.updated_at)}`;
        rawLinkEl.href =
          item.html_url ||
          `https://github.com/${OWNER}/${REPO}/blob/${BRANCH_FALLBACK}/${item.path}`;
        codewrap.innerHTML = `<div class="status">Loading ${item.name}…</div>`;

        try {
          const res = await fetch(item.download_url);
          if (!res.ok)
            throw new Error(`Couldn't load this file (${res.status}).`);
          const text = await res.text();
          currentCode = text;

          const ext = item.name.split(".").pop().toLowerCase();
          const lang = LANG_MAP[ext] || "none";

          const pre = document.createElement("pre");
          pre.className = `language-${lang}`;
          const code = document.createElement("code");
          code.className = `language-${lang}`;
          code.textContent = text;
          pre.appendChild(code);

          codewrap.innerHTML = "";
          codewrap.appendChild(pre);
          Prism.highlightElement(code);

          stack.push({ __file: true });
        } catch (err) {
          codewrap.innerHTML = `<div class="status error">${err.message}</div>`;
        }
      }

      backBtn.addEventListener("click", () => {
        if (stack.length <= 1) return;
        stack.pop();
        const top = stack[stack.length - 1];
        if (typeof top === "string") {
          renderFolder(top);
        }
      });

      renderFolder("");
    </script>
  </body>
</html>
