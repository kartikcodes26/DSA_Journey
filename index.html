<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA_Journey — Repo Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<style>
  :root{
    --bg: #0d1117;
    --panel: #10151c;
    --line: #1f2937;
    --text: #c9d1d9;
    --dim: #6e7681;
    --accent: #7ee787;
    --accent2: #58a6ff;
    --folder: #58a6ff;
    --mono: "JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--mono); font-size:14px;
    height:100vh; display:flex; flex-direction:column;
  }
  header{
    padding:14px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  header .prompt{color:var(--accent);}
  header h1{font-size:15px; margin:0; font-weight:600; color:var(--text);}
  header .repo-link{color:var(--dim); font-size:12px; text-decoration:none; margin-left:auto;}
  header .repo-link:hover{color:var(--accent2);}
  .layout{flex:1; display:flex; min-height:0;}
  #tree{
    width:300px; min-width:220px; overflow-y:auto; border-right:1px solid var(--line);
    padding:10px 8px; background:var(--panel);
  }
  #viewer{flex:1; display:flex; flex-direction:column; min-width:0;}
  .filebar{
    padding:8px 16px; border-bottom:1px solid var(--line); color:var(--dim);
    font-size:12px; display:flex; justify-content:space-between; gap:12px;
  }
  .filebar a{color:var(--dim); text-decoration:none;}
  .filebar a:hover{color:var(--accent2);}
  #codewrap{flex:1; overflow:auto; margin:0;}
  pre[class*="language-"]{margin:0; height:100%; border-radius:0; background:var(--bg) !important; font-size:13px;}
  code{font-family:var(--mono) !important;}
  .placeholder{
    display:flex; align-items:center; justify-content:center; height:100%;
    color:var(--dim); flex-direction:column; gap:6px; text-align:center; padding:20px;
  }
  .placeholder .cursor{
    display:inline-block; width:8px; height:16px; background:var(--accent);
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .node{white-space:nowrap; user-select:none;}
  .node .row{
    display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:4px; cursor:pointer;
  }
  .node .row:hover{background:#161b22;}
  .node .row.active{background:#132436; color:var(--accent2);}
  .node .children{margin-left:16px; border-left:1px dashed var(--line); padding-left:6px;}
  .icon{width:14px; text-align:center; flex-shrink:0; font-size:12px;}
  .folder-icon{color:var(--folder);}
  .file-icon{color:var(--dim);}
  .name{overflow:hidden; text-overflow:ellipsis;}
  .caret{width:10px; color:var(--dim); font-size:10px; flex-shrink:0;}
  .loading, .error{padding:12px; color:var(--dim); font-size:12px;}
  .error{color:#f85149;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:#21262d; border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<header>
  <span class="prompt">~/</span>
  <h1 id="repo-title">loading repo…</h1>
  <a class="repo-link" id="repo-link" href="#" target="_blank" rel="noopener">view on github.com →</a>
</header>

<div class="layout">
  <div id="tree"><div class="loading">fetching file tree…</div></div>
  <div id="viewer">
    <div class="filebar">
      <span id="current-path">no file selected</span>
      <a id="raw-link" href="#" target="_blank" rel="noopener" style="display:none;">raw ↗</a>
    </div>
    <div id="codewrap">
      <div class="placeholder">
        <span class="cursor"></span>
        <div style="margin-top:10px;">select a file from the tree to view its contents</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script>
Prism.plugins.autoloader.languages_path = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/';

// ---- Config: change these two to point the explorer at any repo ----
const OWNER = "kartikcodes26";
const REPO  = "DSA_Journey";
const BRANCH_FALLBACK = "main";
// ----------------------------------------------------------------------

const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const treeEl = document.getElementById('tree');
const codewrap = document.getElementById('codewrap');
const currentPathEl = document.getElementById('current-path');
const rawLinkEl = document.getElementById('raw-link');

document.getElementById('repo-title').textContent = `${OWNER}/${REPO}`;
document.getElementById('repo-link').href = `https://github.com/${OWNER}/${REPO}`;

const LANG_MAP = {
  js:'javascript', ts:'typescript', py:'python', java:'java', cpp:'cpp', cc:'cpp',
  c:'c', h:'c', hpp:'cpp', cs:'csharp', go:'go', rs:'rust', rb:'ruby', php:'php',
  html:'markup', htm:'markup', xml:'markup', css:'css', json:'json', md:'markdown',
  sh:'bash', yml:'yaml', yaml:'yaml', sql:'sql', kt:'kotlin', swift:'swift',
  txt:'none', gitignore:'none'
};

async function ghFetch(path=''){
  const res = await fetch(`${API}/contents/${path}`);
  if(!res.ok){
    if(res.status === 403) throw new Error('GitHub API rate limit hit — try again in a bit.');
    if(res.status === 404) throw new Error('Repo or path not found.');
    throw new Error(`GitHub API error: ${res.status}`);
  }
  return res.json();
}

async function buildTree(){
  try{
    const rootItems = await ghFetch('');
    treeEl.innerHTML = '';
    treeEl.appendChild(renderLevel(rootItems, ''));
  }catch(err){
    treeEl.innerHTML = `<div class="error">${err.message}</div>`;
  }
}

function renderLevel(items, parentPath){
  const wrap = document.createElement('div');
  const sorted = [...items].sort((a,b) => {
    if(a.type !== b.type) return a.type === 'dir' ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
  for(const item of sorted){
    const node = document.createElement('div');
    node.className = 'node';

    const row = document.createElement('div');
    row.className = 'row';

    if(item.type === 'dir'){
      row.innerHTML = `<span class="caret">▸</span><span class="icon folder-icon">▤</span><span class="name">${item.name}</span>`;
      node.appendChild(row);
      let childrenLoaded = false;
      let childrenEl = null;
      row.addEventListener('click', async () => {
        const caret = row.querySelector('.caret');
        if(!childrenLoaded){
          caret.textContent = '…';
          try{
            const subItems = await ghFetch(item.path);
            childrenEl = renderLevel(subItems, item.path);
            childrenEl.className = 'children';
            node.appendChild(childrenEl);
            childrenLoaded = true;
          }catch(err){
            caret.textContent = '▸';
            const e = document.createElement('div');
            e.className = 'error';
            e.textContent = err.message;
            node.appendChild(e);
            return;
          }
        }
        const isOpen = childrenEl.style.display !== 'none';
        childrenEl.style.display = isOpen ? 'none' : 'block';
        caret.textContent = isOpen ? '▸' : '▾';
      });
    } else {
      row.innerHTML = `<span class="caret"></span><span class="icon file-icon">▫</span><span class="name">${item.name}</span>`;
      row.addEventListener('click', () => {
        document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
        row.classList.add('active');
        openFile(item);
      });
      node.appendChild(row);
    }
    wrap.appendChild(node);
  }
  return wrap;
}

async function openFile(item){
  currentPathEl.textContent = item.path;
  rawLinkEl.style.display = 'inline';
  rawLinkEl.href = item.html_url || `https://github.com/${OWNER}/${REPO}/blob/${BRANCH_FALLBACK}/${item.path}`;
  codewrap.innerHTML = `<div class="loading">loading ${item.name}…</div>`;

  try{
    const res = await fetch(item.download_url);
    if(!res.ok) throw new Error(`Could not load file (${res.status})`);
    const text = await res.text();

    const ext = item.name.split('.').pop().toLowerCase();
    const lang = LANG_MAP[ext] || 'none';

    const pre = document.createElement('pre');
    pre.className = `language-${lang} line-numbers`;
    const code = document.createElement('code');
    code.className = `language-${lang}`;
    code.textContent = text;
    pre.appendChild(code);

    codewrap.innerHTML = '';
    codewrap.appendChild(pre);
    Prism.highlightElement(code);
  }catch(err){
    codewrap.innerHTML = `<div class="error">${err.message}</div>`;
  }
}

buildTree();
</script>

</body>
</html>
