<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DSA Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />
  <style>
    :root {
      --bg: #0c0d10;
      --surface: #15161b;
      --surface-hover: #1b1d23;
      --border: #212329;
      --text: #e7e8ec;
      --dim: #86878f;
      --dim-2: #55565e;
      --accent: #7684f0;
      --accent-soft: rgba(118, 132, 240, 0.13);
      --accent-2: #5fc9b8;
      --accent-2-soft: rgba(95, 201, 184, 0.13);
      --accent-3: #ef8fae;
      --accent-3-soft: rgba(239, 143, 174, 0.13);
      --folder: rgba(255, 212, 59, 1);
      --folder-soft: rgba(255, 212, 59, 0.13);
      --danger: #e2664f;
      --danger-soft: rgba(226, 102, 79, 0.12);
      --ok: #4fb06c;
      --ok-soft: rgba(79, 176, 108, 0.13);
      --radius-sm: 8px;
      --radius: 12px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --heading-font: "Outfit", sans-serif;
      --body-font: "Inter", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      
      /* syntax token palette */
      --tok-comment: #74807a;
      --tok-keyword: #ef8fae;
      --tok-string: #8ad9b5;
      --tok-number: #f0b464;
      --tok-function: #a68bf0;
      --tok-tag: #ef8d75;
      --tok-operator: #74b8e0;
      --tok-variable: #f0b464;
      --tok-punctuation: #8b949e;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html,
    body {
      height: 100%;
    }
    
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--body-font);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior-y: none;
    }
    
    .icon-svg {
      flex-shrink: 0;
      display: block;
    }
    
    button {
      font-family: inherit;
      appearance: none;
    }
    
    .hidden {
      display: none !important;
    }
    
    /* Write buttons stay visible without a write token, just dimmed, so the
       create/edit/delete feature is discoverable. Clicking opens the prompt. */
    .locked {
      opacity: 0.45;
      filter: saturate(0.5);
    }
    
    .locked:hover {
      opacity: 0.7;
    }
    
    /* Offline banner */
    #offline-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: #f0b464;
      background: rgba(240, 180, 100, 0.1);
      padding: 8px 16px;
      flex-shrink: 0;
    }
    
    #offline-banner.show {
      display: flex;
    }
    
    /* Header */
    header {
      position: relative;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 12px;
      flex-shrink: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    
    header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: linear-gradient(90deg,
          var(--accent) 0%,
          var(--accent-2) 55%,
          var(--accent-3) 100%);
      opacity: 0.55;
    }
    
    #back-btn {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition:
        background 0.12s var(--ease),
        border-color 0.12s var(--ease),
        transform 0.1s var(--ease);
    }
    
    #back-btn.show {
      display: flex;
      animation: fade-in 0.15s var(--ease);
    }
    
    #back-btn:hover {
      border-color: var(--accent);
    }
    
    #back-btn:active {
      transform: scale(0.92);
      background: var(--surface-hover);
    }
    
    .header-text {
      min-width: 0;
      flex: 1;
    }
    
    #crumb {
      font-size: 12px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      margin-bottom: 2px;
    }
    
    #title {
      font-family: var(--heading-font);
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    
    .header-icon-btn {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      text-decoration: none;
      cursor: pointer;
      transition:
        background 0.12s var(--ease),
        border-color 0.12s var(--ease),
        color 0.12s var(--ease);
    }
    
    .header-icon-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    
    .header-icon-btn:active {
      background: var(--surface-hover);
    }
    
    .header-icon-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    
    /* Search panel */
    #search-panel {
      display: none;
      margin: 4px 16px 8px;
    }
    
    #search-panel.show {
      display: block;
      animation: fade-in 0.15s var(--ease);
    }
    
    .search-panel-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      flex-wrap: wrap;
    }
    
    .search-panel-icon {
      color: var(--accent);
      display: flex;
      flex-shrink: 0;
      margin-left: 2px;
    }
    
    #search-input {
      flex: 1;
      min-width: 140px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.12s var(--ease);
    }
    
    #search-input::placeholder {
      color: var(--dim-2);
    }
    
    #search-input:focus {
      border-color: var(--accent);
    }
    
    .mini-btn {
      border: 1px solid rgba(118, 132, 240, 0.35);
      background: var(--accent-soft);
      color: var(--accent);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition:
        background 0.12s var(--ease),
        transform 0.08s var(--ease);
      white-space: nowrap;
    }
    
    .mini-btn:hover {
      background: rgba(118, 132, 240, 0.22);
    }
    
    .mini-btn:active {
      transform: scale(0.95);
    }
    
    .mini-btn.ghost {
      background: var(--bg);
      border-color: var(--border);
      color: var(--dim);
      padding: 8px 9px;
    }
    
    .mini-btn.ghost:hover {
      border-color: var(--dim-2);
      color: var(--text);
    }
    
    .result-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--accent-3);
      font-weight: 600;
    }
    
    /* Views */
    #app {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    
    .view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      animation: view-in 0.16s var(--ease);
    }
    
    @keyframes view-in {
      from {
        opacity: 0;
      }
      
      to {
        opacity: 1;
      }
    }
    
    /* List view */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition:
        background 0.12s var(--ease),
        border-color 0.12s var(--ease),
        box-shadow 0.12s var(--ease),
        transform 0.08s var(--ease);
      opacity: 0;
      animation: row-in 0.22s var(--ease) forwards;
    }
    
    @media (prefers-reduced-motion: reduce) {
      .row {
        animation: none;
        opacity: 1;
      }
      
      .view {
        animation: none;
      }
    }
    
    @keyframes row-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .row:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    
    .row:active {
      transform: scale(0.988);
    }
    
    .badge {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .badge.folder {
      background: var(--folder-soft);
      color: var(--folder);
    }
    
    .lang-badge {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    
    .row-info {
      flex: 1;
      min-width: 0;
    }
    
    .row-name {
      font-weight: 500;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    
    .row-sub {
      font-size: 11.5px;
      color: var(--dim);
      margin-top: 2px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .row-sub .dot {
      opacity: 0.5;
    }
    
    .row-chev {
      color: var(--dim-2);
      flex-shrink: 0;
      display: flex;
      transition: transform 0.12s var(--ease);
    }
    
    .row:hover .row-chev {
      transform: translateX(1px);
      color: var(--accent);
    }
    
    .status {
      padding: 32px 4px;
      color: var(--dim);
      font-size: 13.5px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    
    .status.error {
      color: var(--danger);
    }
    
    .status-icon {
      color: var(--dim-2);
      opacity: 0.8;
    }
    
    .status.error .status-icon {
      color: var(--danger);
      opacity: 0.85;
    }
    
    .retry-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition:
        background 0.12s var(--ease),
        border-color 0.12s var(--ease);
    }
    
    .retry-btn:hover {
      border-color: var(--accent);
    }
    
    .retry-btn:active {
      background: var(--surface-hover);
      transform: scale(0.96);
    }
    
    .empty {
      padding: 56px 20px;
      text-align: center;
      color: var(--dim);
      font-size: 13.5px;
    }
    
    .empty-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
      color: var(--dim-2);
    }
    
    .skeleton-row {
      height: 58px;
      border-radius: var(--radius);
      background: linear-gradient(100deg,
          var(--surface) 30%,
          var(--surface-hover) 50%,
          var(--surface) 70%);
      background-size: 200% 100%;
      animation: shimmer 1.3s ease-in-out infinite;
      margin-bottom: 6px;
    }
    
    @keyframes shimmer {
      from {
        background-position: 150% 0;
      }
      
      to {
        background-position: -50% 0;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .skeleton-row {
        animation: none;
        background: var(--surface);
      }
    }
    
    /* Code view */
    #code-view {
      display: none;
      flex-direction: column;
      padding: 0;
    }
    
    .filebar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin: 4px 16px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: var(--radius);
    }
    
    .filebar-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .filebar-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .filebar-dates {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .filebar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    
    .icon-btn {
      border: none;
      cursor: pointer;
      font-family: var(--body-font);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 5px;
      transition:
        background 0.12s var(--ease),
        border-color 0.12s var(--ease),
        transform 0.08s var(--ease),
        color 0.12s var(--ease);
      text-decoration: none;
      white-space: nowrap;
    }
    
    .icon-btn:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
    }
    
    .icon-btn:active {
      transform: scale(0.94);
    }
    
    .icon-btn.copied {
      color: var(--ok);
      border-color: rgba(79, 176, 108, 0.3);
      background: var(--ok-soft);
    }
    
    #codewrap {
      flex: 1;
      overflow: auto;
      margin: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    
    /* Image view */
    #image-view {
      display: none;
      flex-direction: column;
      padding: 0;
    }
    
    #imagewrap {
      flex: 1;
      overflow: auto;
      margin: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #131419;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    
    #imagewrap img {
      max-width: 100%;
      max-height: 100%;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      object-fit: contain;
    }
    
    #imagewrap .status {
      width: 100%;
    }
    
    pre[class*="language-"] {
      margin: 0;
      min-height: 100%;
      border-radius: var(--radius);
      font-size: 12.5px;
      line-height: 1.6;
      padding: 14px;
      background: #131419 !important;
    }
    
    code {
      font-family: var(--mono) !important;
    }
    
    /* ---- Line numbers gutter ---- */
    pre.line-numbers {
      position: relative;
      padding-left: var(--gutter-width, 3.6em);
    }
    
    pre.line-numbers>code {
      position: relative;
      white-space: inherit;
    }
    
    .line-numbers-rows {
      position: absolute;
      pointer-events: none;
      top: 14px;
      left: 0;
      width: calc(var(--gutter-width, 3.6em) - 0.9em);
      letter-spacing: -1px;
      border-right: 1px solid var(--border);
      user-select: none;
    }
    
    .line-numbers-rows>span {
      display: block;
      counter-increment: linenumber;
      font-size: 12.5px;
      line-height: inherit;
    }
    
    .line-numbers-rows>span::before {
      content: counter(linenumber);
      display: block;
      text-align: right;
      padding-right: 0.9em;
      color: #565964;
      font-variant-numeric: tabular-nums;
    }
    
    /* ---- Detected links inside code ---- */
    a.code-link {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dotted rgba(118, 132, 240, 0.55);
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }
    
    a.code-link:hover {
      background: var(--accent-soft);
      border-bottom-color: var(--accent);
      border-radius: 2px;
    }
    
    /* ---- Custom Prism syntax theme (colorful, matches the app's palette) ---- */
    code[class*="language-"],
    pre[class*="language-"] {
      color: #e7e8ec;
      text-shadow: none;
    }
    
    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata {
      color: var(--tok-comment);
      font-style: italic;
    }
    
    .token.punctuation {
      color: var(--tok-punctuation);
    }
    
    .token.namespace {
      opacity: 0.75;
    }
    
    .token.property,
    .token.tag,
    .token.constant,
    .token.symbol,
    .token.deleted {
      color: var(--tok-tag);
    }
    
    .token.boolean,
    .token.number {
      color: var(--tok-number);
    }
    
    .token.selector,
    .token.attr-name,
    .token.string,
    .token.char,
    .token.builtin,
    .token.inserted {
      color: var(--tok-string);
    }
    
    .token.operator,
    .token.entity,
    .token.url,
    .language-css .token.string,
    .style .token.string {
      color: var(--tok-operator);
    }
    
    .token.atrule,
    .token.attr-value,
    .token.keyword {
      color: var(--tok-keyword);
      font-weight: 500;
    }
    
    .token.function,
    .token.class-name {
      color: var(--tok-function);
    }
    
    .token.regex,
    .token.important,
    .token.variable {
      color: var(--tok-variable);
    }
    
    .token.important,
    .token.bold {
      font-weight: 600;
    }
    
    .token.italic {
      font-style: italic;
    }
    
    .token.entity {
      cursor: help;
    }
    
    /* Preprocessor directives (e.g. #include) */
    .token.preprocessor {
      color: var(--tok-variable);
    }
    
    /* Line highlight / selection niceties */
    ::selection {
      background: rgba(118, 132, 240, 0.25);
    }
    
    pre[class*="language-"] ::selection {
      background: rgba(118, 132, 240, 0.25);
    }
    
    ::-webkit-scrollbar {
      width: 7px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #2a2c34;
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #34363f;
    }
    
    /* ---- Compose (create / edit / delete) view ---- */
    #edit-view {
      display: none;
      flex-direction: column;
      padding: 0;
    }
    
    .compose-meta {
      flex-shrink: 0;
      margin: 4px 16px 8px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent-2);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .field-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
      flex-shrink: 0;
      width: 62px;
    }
    
    .field-input,
    .field-textarea {
      flex: 1;
      min-width: 150px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.12s var(--ease);
    }
    
    .field-textarea {
      resize: vertical;
      min-height: 40px;
      max-height: 140px;
      line-height: 1.5;
    }
    
    .field-input::placeholder,
    .field-textarea::placeholder {
      color: var(--dim-2);
    }
    
    .field-input:focus,
    .field-textarea:focus {
      border-color: var(--accent);
    }
    
    .field-input.mono {
      font-family: var(--mono);
    }
    
    .field-input:disabled,
    .field-textarea:disabled {
      color: var(--dim);
      cursor: not-allowed;
    }
    
    .compose-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .btn-primary,

      display: flex;
      align-items: center;

        transform 0.08s var(--ease),
        opacity 0.12s var(--ease);

      border-color: rgba(95, 201, 184, 0.4);

      color: var(--accent-2);

      background: rgba(95, 201, 184, 0.22);

    .btn-danger {
      border-color: rgba(226, 102, 79, 0.4);
      background: var(--danger-soft);
      color: var(--danger);
    }
    
    .btn-danger:hover {
      background: rgba(226, 102, 79, 0.22);
    }
    
    .btn-primary:active,
    .btn-danger:active {
      transform: scale(0.96);
    }
    
    .btn-primary:disabled,
    .btn-danger:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    
    .mini-btn.ok {
      border-color: rgba(95, 201, 184, 0.4);
      background: var(--accent-2-soft);
      color: var(--accent-2);
    }
    
    .mini-btn.ok:hover {
      background: rgba(95, 201, 184, 0.22);
    }
    
    .mini-btn.danger {
      border-color: rgba(226, 102, 79, 0.35);
      background: var(--danger-soft);
      color: var(--danger);
    }
    
    .mini-btn.danger:hover {
      background: rgba(226, 102, 79, 0.22);

      font-size: 11.5px;
      color: var(--dim);
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.55;
    }
    
    .compose-hint code {
      font-size: 11px;
      color: var(--accent);
      font-family: var(--mono);
    }
    
    .compose-hint svg {
      margin-top: 1px;
    }
    
    .compose-hint.warn {
      color: var(--danger);
    }

      flex: 1;
      min-height: 0;
      display: flex;

      border: 1px solid var(--border);

      overflow: hidden;

    #editor {

      border: none;

      white-space: pre;
      overflow: auto;

      font-size: 11.5px;
      color: var(--dim);

      align-items: center;
      gap: 6px;
      min-height: 17px;
    }
    
    .compose-status.ok {
      color: var(--ok);
    }
    
    .compose-status.error {
      color: var(--danger);
    }
    
    /* ---- Row-level actions (per-file edit / delete) ---- */
    .row-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    
    .row-tool {
      background: transparent;
      border: 1px solid transparent;
      color: var(--dim-2);
      padding: 6px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition:
        color 0.12s var(--ease),
        border-color 0.12s var(--ease),
        background 0.12s var(--ease),
        transform 0.08s var(--ease);
    }
    
    .row-tool:hover {
      color: var(--accent);
      border-color: rgba(118, 132, 240, 0.35);
      background: var(--accent-soft);
    }
    
    .row-tool.del:hover {
      color: var(--danger);
      border-color: rgba(226, 102, 79, 0.35);
      background: var(--danger-soft);
    }
    
    .row-tool:active {
      transform: scale(0.92);
    }
    
    #list-actions {
      position: absolute;
      top: 4px;
      left: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: none;
    }
    
    #list-actions>* {
      pointer-events: auto;
    }
    
    #list-actions:empty,
    #list-actions.hidden {
      display: none;
    }
    
    /* The list view needs headroom for the floating action bar. */
    #list-view.has-actions {
      padding-top: 44px;
    }
    
    /* ---- Modal (confirm / prompt) ---- */
    #modal-root {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(6, 7, 9, 0.72);

      display: flex;
      animation: fade-in 0.14s var(--ease);
    }
    
    @keyframes fade-in {
      from {
        opacity: 0;
      }
      
      to {
        opacity: 1;
      }
    }
    
    @keyframes modal-in {
      from {
        opacity: 0;
        transform: translateY(6px) scale(0.985);
      }
      
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    .modal {
      width: 100%;
      max-width: 420px;
      max-height: 100%;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
      animation: modal-in 0.16s var(--ease);
    }
    
    .modal.danger {
      border-top-color: var(--danger);
    }
    
    @media (prefers-reduced-motion: reduce) {
      .modal,
      #modal-root.show {
        animation: none;
      }
    }
    
    .modal-title {
      font-family: var(--heading-font);
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .modal-title.danger {

    }

      color: var(--dim);
      line-height: 1.55;
      word-break: break-word;
    }
    
    .modal-text strong {
      color: var(--text);
      font-weight: 600;
    }
    
    .modal-text code {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--accent);
    }
    
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .modal-field>label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
    }
    
    /* ---- Commit confirmation banner ---- */
    .commit-banner {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 12px);
      z-index: 70;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid rgba(79, 176, 108, 0.4);
      border-radius: var(--radius);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      font-size: 12.5px;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.18s var(--ease),
        transform 0.18s var(--ease);
    }
    
    .commit-banner.show {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }
    
    .commit-banner>svg {
      color: var(--ok);
      flex-shrink: 0;
    }
    
    .commit-banner>span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .commit-banner>a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      flex-shrink: 0;
      border-bottom: 1px dotted rgba(118, 132, 240, 0.5);
    }
    
    .commit-banner>a:hover {
      border-bottom-color: var(--accent);
    }
    
    /* Footer */
    footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px));

      color: var(--dim-2);
      background: var(--bg);

    .vibe-mark {

      letter-spacing: 0.16em;

    .vibe-dot {

      font-size: 9px;
    }
    
    /* Small screens */
    @media (max-width: 380px) {
      #title {
        font-size: 18px;
      }
      
      .filebar-dates {
        display: none;
      }
    }

</head>

        if (match.index > lastIndex) {
          frag.appendChild(
            document.createTextNode(text.slice(lastIndex, match.index)),

        a.className = "code-link";

    // navigation stack: array of path strings ('' = root), {__file:true} markers,

    async function fetchWithTimeout(url, opts = {}) {
      const controller = new AbortController();
      activeController = controller;
      const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
      try {
        const res = await fetch(url, { ...opts, signal: controller.signal });
        return res;
      } finally {
        clearTimeout(timeout);
      }
    }
    
    async function ghFetch(path) {
      let res;
      try {
        res = await fetchWithTimeout(`${API}/contents/${encodeURI(path)}`, {
          headers: authHeaders({ Accept: "application/vnd.github+json" }),
        });
      } catch (err) {
        if (err.name === "AbortError") {
          throw new Error("Request timed out â€” check your connection.");
        }
        throw new Error("Couldn't reach GitHub. Check your connection.");
      }
      if (!res.ok) {
        if (res.status === 403 || res.status === 429) {
          const remaining = res.headers.get("x-ratelimit-remaining");
          const reset = res.headers.get("x-ratelimit-reset");
          if (remaining === "0" && reset) {
            const waitSec = Math.max(
              0,
              Math.ceil(Number(reset) - Date.now() / 1000),
            );
            const mins = Math.ceil(waitSec / 60);
            throw new Error(
              `Rate limited by GitHub â€” try again in about ${mins} minute${mins === 1 ? "" : "s"}.`,
            );
          }
          throw new Error("Too many requests right now â€” try again shortly.");
        }
        if (res.status === 404) throw new Error("Couldn't find that.");
        throw new Error(`Something went wrong (${res.status}).`);
      }
      return res.json();
    }

    // ============ Compose: open, commit, delete ============
    // Creates or edits a file, then commits the change with a custom message.
    // mode: "create" | "update"
    function openComposer({ mode, path, content, sha }) {
      if (!hasWriteAccess()) {
        promptForToken();
        return;
      }
      const fullPath = normalizeRepoPath(path || "");
      const initialContent = content || "";
      composeState = {
        mode,
        path: fullPath,
        originalPath: fullPath,
        // Snapshot of the text as opened, so "unsaved changes" is detectable.
        content: initialContent,
        sha: sha || null,
      };
      
      showCompose();
      backBtn.classList.add("show");
      crumbEl.textContent = `Commit to ${BRANCH_WRITE}`;
      titleEl.textContent = mode === "create" ?
        "New file" :
        fullPath.split("/").pop();
      
      fileNameInput.value = fullPath;
      editorEl.value = initialContent;
      commitMessageInput.value = suggestCommitMessage(mode, fullPath || "file");
      commitDescInput.value = "";
      composeStatus("");
      setComposeBusy(false);
      updateDeleteButtonLabel();
      updateComposePreview();
      
      stack.push({ __compose: true });
      (mode === "create" ? fileNameInput : editorEl).focus();
    }
    
    function updateDeleteButtonLabel() {
      // Delete only makes sense when editing an existing file.
      const deletable = Boolean(composeState) && composeState.mode === "update";
      deleteFileBtn.classList.toggle("hidden", !deletable);

    // PUT /contents/{path} â€” creates the file, or updates it when `sha` is set.
    async function commitFile({ path, content, sha, message, description }) {
      const identity = await ensureCommitIdentity();
      const body = {
        message,
        content: encodeUtf8Base64(content),
        branch: BRANCH_WRITE,
        committer: committerFromIdentity(identity),
      };
      if (description) body.extended_description = description;
      if (sha) body.sha = sha;
      return githubRequest(`/contents/${encodeRepoPath(path)}`, {
        method: "PUT",
        body,
      });
    }
    
    // DELETE /contents/{path}
    async function deleteRemoteFile({ path, sha, message, description }) {
      const identity = await ensureCommitIdentity();
      const body = {
        message,
        sha,
        branch: BRANCH_WRITE,
        committer: committerFromIdentity(identity),
      };
      if (description) body.extended_description = description;
      return githubRequest(`/contents/${encodeRepoPath(path)}`, {
        method: "DELETE",
        body,
      });
    }
    
    function shortSha(sha) {
      return sha ? sha.slice(0, 7) : "committed";
    }
    
    // Drop caches a write invalidates so lists/searches show fresh data.
    function invalidateRepoCaches() {
      problemIndex = null;
      try {
        localStorage.removeItem(INDEX_STORAGE_KEY);
      } catch (e) {
        // ignore
      }
    }
    
    // A small, self-dismissing confirmation banner for completed commits.
    let bannerTimer = null;
    function flashBanner(text, url) {
      let el = document.getElementById("commit-banner");
      if (!el) {
        el = document.createElement("div");
        el.id = "commit-banner";
        el.className = "commit-banner";
        document.body.appendChild(el);
      }
      el.innerHTML =
        `${icon("check", 14)}<span>${escapeHtml(text)}</span>` +
        (url ?
          `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">View commit</a>` :
          "");
      el.classList.add("show");
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => el.classList.remove("show"), 4000);
    }

    async function handleCommitClick() {
      if (!composeState) return;
      
      const path = normalizeRepoPath(fileNameInput.value);
      const message = commitMessageInput.value.trim();
      const description = commitDescInput.value.trim();
      
      const badPath = pathError(path);
      if (badPath) {
        composeStatus(badPath, "error");
        fileNameInput.focus();
        return;
      }
      if (!message) {
        composeStatus("Add a commit message so the change is easy to find.", "error");
        commitMessageInput.focus();
        return;
      }
      
      setComposeBusy(true, "Committingâ€¦");
      composeStatus("Reading the latest version from GitHubâ€¦");
      
      try {
        // Re-read the live blob so two edits in a row can never conflict.
        const live = await fetchRemoteFile(path);
        
        if (composeState.mode === "create" && live) {
          setComposeBusy(false);
          composeStatus(
            `${path} already exists â€” edit it instead.`,
            "error",
          );
          return;
        }
        if (composeState.mode === "update" && !live) {
          setComposeBusy(false);
          composeStatus(`${path} no longer exists on GitHub â€” nothing to update.`, "error");
          return;
        }
        
        const content = editorEl.value;
        if (live && live.content === content) {
          setComposeBusy(false);
          composeStatus("No changes to commit.", "error");
          return;
        }
        
        composeStatus(`Committing to ${BRANCH_WRITE}â€¦`);
        const res = await commitFile({
          path,
          content,
          sha: live ? live.sha : null,
          message,
          description,
        });
        
        const verb = live ? "Updated" : "Created";
        invalidateRepoCaches();
        setComposeBusy(false);
        composeStatus(`${verb} ${path} â€” ${shortSha(res.commit.sha)}`, "ok");
        stack.pop();
        await renderFolder(parentPath(path));
        flashBanner(`${verb} ${path}`, res.commit.html_url);
      } catch (err) {
        setComposeBusy(false);
        composeStatus(err.message || "Couldn't commit that change.", "error");
      }
    }
    
    // Shared delete flow: confirm in a modal (with a commit message field),
    // then DELETE the contents entry so GitHub records a commit.
    async function confirmAndDeleteFile({ path, sha, message, onDone, onError }) {
      if (!hasWriteAccess()) {
        promptForToken();
        return;
      }
      let live = null;
      try {
        live = await fetchRemoteFile(path);
        if (!live) {
          if (onError) onError(`${path} doesn't exist on GitHub any more.`);
          return;
        }
      } catch (err) {
        if (onError) onError(err.message || "Couldn't reach GitHub.");
        return;
      }
      
      const messageInput = modalInput(
        "delete-commit-message",
        message || suggestCommitMessage("delete", path),
        "Commit message (required)",
      );
      
      openModal({
        title: "Delete file?",
        danger: true,
        body: [
          modalText(
            `This removes <code>${escapeHtml(path)}</code> from <strong>${escapeHtml(BRANCH_WRITE)}</strong> and records a commit.`,
          ),
          modalField("Commit message", messageInput),
        ],
        confirmLabel: "Delete & commit",
        onConfirm: async () => {
          const msg = messageInput.value.trim();
          if (!msg) {
            messageInput.focus();
            return;
          }
          try {
            const res = await deleteRemoteFile({
              path,
              sha: live.sha,
              message: msg,
            });
            invalidateRepoCaches();
            closeModal();
            flashBanner(`Deleted ${path}`, res.commit.html_url);
            if (onDone) onDone(res);
          } catch (err) {
            closeModal();
            if (onError) onError(err.message || "Couldn't delete that file.");
            else flashBanner(err.message || "Couldn't delete that file");
          }
        },
      });
    }

    // ---- Modal helpers (confirm / prompt) ----
    let activeModalCleanup = null;
    
    function closeModal() {
      if (activeModalCleanup) {
        activeModalCleanup();
        activeModalCleanup = null;
      }
      modalRoot.classList.remove("show");
      modalRoot.innerHTML = "";
    }
    
    function openModal({ title, danger, body, confirmLabel, onConfirm }) {
      closeModal();
      const modal = document.createElement("div");
      modal.className = "modal" + (danger ? " danger" : "");
      
      const heading = document.createElement("div");
      heading.className = "modal-title" + (danger ? " danger" : "");
      heading.innerHTML = `${icon(danger ? "alert" : "git", 17)}<span>${escapeHtml(title)}</span>`;
      modal.appendChild(heading);
      
      (body || []).forEach((el) => modal.appendChild(el));
      
      const actions = document.createElement("div");
      actions.className = "modal-actions";
      const cancelBtn = document.createElement("button");
      cancelBtn.className = "mini-btn ghost";
      cancelBtn.textContent = "Cancel";
      cancelBtn.addEventListener("click", closeModal);
      const confirmBtn = document.createElement("button");
      confirmBtn.className = danger ? "btn-danger" : "btn-primary";
      confirmBtn.innerHTML = `${icon(danger ? "trash" : "check", 14)} <span>${escapeHtml(confirmLabel || "Confirm")}</span>`;
      actions.appendChild(cancelBtn);
      actions.appendChild(confirmBtn);
      modal.appendChild(actions);
      
      modalRoot.innerHTML = "";
      modalRoot.appendChild(modal);
      modalRoot.classList.add("show");
      
      // Enter confirms, Escape cancels, and the backdrop closes.
      const onKey = (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          closeModal();
        } else if (e.key === "Enter" && !e.shiftKey) {
          const tag = document.activeElement && document.activeElement.tagName;
          if (tag === "TEXTAREA") return; // Enter belongs to the textarea
          e.preventDefault();
          confirmBtn.click();
        }
      };
      document.addEventListener("keydown", onKey);
      const onBackdrop = (e) => {
        if (e.target === modalRoot) closeModal();
      };
      modalRoot.addEventListener("click", onBackdrop);
      activeModalCleanup = () => {
        document.removeEventListener("keydown", onKey);
        modalRoot.removeEventListener("click", onBackdrop);
      };
      
      confirmBtn.addEventListener("click", async () => {
        confirmBtn.disabled = true;
        cancelBtn.disabled = true;
        const original = confirmBtn.innerHTML;
        confirmBtn.innerHTML = `${icon("loader", 14)} <span>Workingâ€¦</span>`;
        try {
          await onConfirm();
        } finally {
          confirmBtn.innerHTML = original;
          confirmBtn.disabled = false;
          cancelBtn.disabled = false;
        }
      });
      
      const firstField = modal.querySelector("input, textarea");
      if (firstField) firstField.focus();
      return { modal, confirmBtn, cancelBtn, onKey };
    }
    
    function modalText(html) {
      const el = document.createElement("div");
      el.className = "modal-text";
      el.innerHTML = html;
      return el;
    }
    
    function modalField(labelText, inputEl) {
      const wrap = document.createElement("div");
      wrap.className = "modal-field";
      const label = document.createElement("label");
      label.textContent = labelText;
      label.setAttribute("for", inputEl.id || "");
      wrap.appendChild(label);
      wrap.appendChild(inputEl);
      return wrap;
    }
    
    function modalInput(id, value, placeholder, className) {
      const input = document.createElement("input");
      input.id = id;
      input.className = className || "field-input";
      input.type = "text";
      input.value = value || "";
      input.placeholder = placeholder || "";
      input.spellcheck = false;
      input.autocomplete = "off";
      return input;
    }
    
    async function renderFolder(path) {
      showList();
      updateHeader(path);
      renderSkeleton();
      renderListActions(path);
      try {
        const items = await ghFetch(path);
        if (!Array.isArray(items)) {
          listView.innerHTML = "";
          listView.appendChild(
            errorStatus("That doesn't look like a folder.", () =>
              renderFolder(path),
            ),
          );
          return;
        }
        const visible = items.filter(
          (item) => !HIDDEN_PATTERNS.some((re) => re.test(item.name)),
        );
        if (visible.length === 0) {
          listView.innerHTML = "";
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.innerHTML = `<span class="empty-icon">${icon("emptyFolder", 30)}</span>Nothing to see here.`;
          listView.appendChild(empty);
          const addBtn = document.createElement("button");
          addBtn.className = "mini-btn ok" + (hasWriteAccess() ? "" : " locked");
          addBtn.innerHTML = `${icon("plus", 13)} New file here`;
          if (!hasWriteAccess()) {
            addBtn.title = "Needs a GitHub token with the repo scope";
          }
          addBtn.addEventListener("click", () => startNewFile(path));
          const wrap = document.createElement("div");
          wrap.style.display = "flex";
          wrap.style.justifyContent = "center";
          wrap.appendChild(addBtn);
          listView.appendChild(wrap);
          return;
        }
        const sorted = [...visible].sort((a, b) => {
          if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
          return a.name.localeCompare(b.name);
        });
        const list = document.createElement("div");
        list.className = "card-list";
        sorted.forEach((item, i) => {
          const row = document.createElement("div");
          row.className = "row";
          row.style.animationDelay = `${Math.min(i, 10) * 18}ms`;
          const createdLabel = formatDate(item.created_at);
          const updatedLabel = formatDate(item.updated_at);
          const dateBits = [];
          if (createdLabel) dateBits.push(`Created ${createdLabel}`);
          if (updatedLabel) dateBits.push(`Modified ${updatedLabel}`);
          
          if (item.type === "dir") {
            row.innerHTML = `
          <div class="badge folder">${icon("folder", 18)}</div>
          <div class="row-info">
            <div class="row-name">${escapeHtml(item.name)}</div>
            <div class="row-sub">Folder${dateBits.length ? `<span class="dot">Â·</span>${dateBits.join(" Â· ")}` : ""}</div>
          </div>
          <div class="row-chev">${icon("chevron", 15)}</div>`;
            row.addEventListener("click", () => {
              stack.push(item.path);
              renderFolder(item.path);
            });
          } else {
            const sizeLabel = formatBytes(item.size);
            row.innerHTML = `
          <div class="badge">${fileIconHtml(item.name)}</div>
          <div class="row-info">
            <div class="row-name">${escapeHtml(item.name)}</div>
            <div class="row-sub">${sizeLabel}${dateBits.length ? `<span class="dot">Â·</span>${dateBits.join(" Â· ")}` : ""}</div>
          </div>
          <div class="row-chev">${icon("chevron", 15)}</div>`;
            row.addEventListener("click", () => openFile(item));
            addRowTools(row, item);
          }
          list.appendChild(row);
        });
        listView.innerHTML = "";
        listView.appendChild(list);
      } catch (err) {
        listView.innerHTML = "";
        listView.appendChild(
          errorStatus(err.message, () => renderFolder(path)),

      }

    function escapeHtml(str) {

    // Extra per-row buttons (edit / delete), always shown so the feature is

    function addRowTools(row, item) {
      const locked = hasWriteAccess() ? "" : " locked";

      const editTool = document.createElement("button");

      editTool.setAttribute("aria-label", `Edit ${item.name}`);
      editTool.innerHTML = icon("edit", 14);
      editTool.addEventListener("click", (e) => {

        startEditExistingFile(item);

      const delTool = document.createElement("button");
      delTool.className = "row-tool del" + locked;
      delTool.title = hasWriteAccess() ?
        `Delete ${item.name}` :
        `Delete ${item.name} â€” needs a GitHub token with the repo scope`;
      delTool.setAttribute("aria-label", `Delete ${item.name}`);

    // A slim floating toolbar above the list with folder-scoped write actions.

    function renderListActions(path) {

    // ---- Entry points for creating / editing files ----
    function startNewFile(dirPath) {
      openComposer({
        mode: "create",
        path: dirPath ? `${dirPath}/` : "",
        content: "",
        sha: null,
      });
    }
    
    function startEditExistingFile(item) {
      // Open immediately with whatever text is already in memory, then swap in
      // the live blob (sha + content) so the commit is based on GitHub's copy.
      const cached =
        currentFileName === item.name && currentCode ? currentCode : "";
      const target = item.path;
      openComposer({
        mode: "update",
        path: target,
        content: cached,
        sha: item.sha || null,
      });
      // openComposer bails out (and prompts for a token) without write access.
      if (!composeState) return;
      composeStatus("Loading the latest version from GitHubâ€¦");
      fetchRemoteFile(target)
        .then((live) => {
          // The user may have navigated away or switched files by now.
          if (!composeState || composeState.path !== target) return;
          if (!live) {
            composeStatus(`${target} no longer exists on GitHub.`, "error");
            return;
          }
          composeState.sha = live.sha;
          if (!editorEl.value) {
            editorEl.value = live.content;
            composeState.content = live.content;
          }
          composeStatus("");
        })
        .catch((err) => {
          if (!composeState || composeState.path !== target) return;
          // Committing re-reads the sha, so a failed prefetch isn't fatal.
          composeStatus(err.message || "Couldn't preload the file.", "error");
        });
    }
    
    async function fetchFileContent(item) {
      // Prefer the direct download_url; fall back to the git blob API
      // for large files where GitHub omits download_url.
      if (item.download_url) {
        const res = await fetchWithTimeout(item.download_url);
        if (!res.ok)
          throw new Error(`Couldn't load this file (${res.status}).`);
        return res.text();
      }
      if (item.path) {
        const res = await fetchWithTimeout(rawFileUrl(item.path));
        if (res.ok) return res.text();
      }
      if (item.git_url) {
        const res = await fetchWithTimeout(item.git_url, {
          headers: { Accept: "application/vnd.github+json" },
        });
        if (!res.ok)
          throw new Error(`Couldn't load this file (${res.status}).`);
        const data = await res.json();
        if (data.encoding === "base64") {
          return decodeURIComponent(
            atob(data.content.replace(/\n/g, ""))
            .split("")
            .map((c) => "%" + c.charCodeAt(0).toString(16).padStart(2, "0"))
            .join(""),
          );
        }
        return data.content || "";
      }
      throw new Error("This file can't be previewed.");
    }
    
    function isImageFile(name) {
      const ext = name.includes(".") ?
        name.split(".").pop().toLowerCase() :
        "";
      return IMAGE_EXTENSIONS.has(ext);
    }
    
    async function openImage(item) {
      showImage();
      currentImageItem = item;
      backBtn.classList.add("show");
      crumbEl.textContent =
        item.path.split("/").slice(0, -1).join(" / ") || OWNER;
      titleEl.textContent = item.name;
      imagePathEl.textContent = item.name;
      currentImageName = item.name;
      const createdLabel = formatDate(item.created_at);
      const updatedLabel = formatDate(item.updated_at);
      imageDatesEl.textContent = [
          createdLabel ? `Created ${createdLabel}` : null,
          updatedLabel ? `Modified ${updatedLabel}` : null,
        ]
        .filter(Boolean)
        .join(" Â· ");
      imageRawLinkEl.href =
        item.html_url ||
        `https://github.com/${OWNER}/${REPO}/blob/${BRANCH_FALLBACK}/${item.path}`;
      imagewrap.innerHTML = `<div class="status">Loading ${escapeHtml(item.name)}â€¦</div>`;
      currentImageUrl = "";
      
      try {
        const url = item.download_url;
        if (!url) throw new Error("This image can't be previewed.");
        currentImageUrl = url;
        
        const img = document.createElement("img");
        img.alt = item.name;
        img.onload = () => {
          imagewrap.innerHTML = "";
          imagewrap.appendChild(img);
        };
        img.onerror = () => {
          imagewrap.innerHTML = "";
          const wrap = document.createElement("div");
          wrap.style.padding = "8px";
          wrap.appendChild(
            errorStatus("Couldn't load this image.", () => openImage(item)),
          );
          imagewrap.appendChild(wrap);
        };
        img.src = url;
        
        stack.push({ __file: true });
      } catch (err) {
        imagewrap.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.style.padding = "8px";
        wrap.appendChild(
          errorStatus(err.message || "Couldn't load this image.", () =>
            openImage(item),
          ),
        );
        imagewrap.appendChild(wrap);
      }
    }
    
    async function openFile(item) {
      if (isImageFile(item.name)) {
        await openImage(item);
        return;
      }
      showCode();
      currentFileItem = item;
      backBtn.classList.add("show");
      crumbEl.textContent =
        item.path.split("/").slice(0, -1).join(" / ") || OWNER;
      titleEl.textContent = item.name;
      currentPathEl.textContent = item.name;
      currentFileName = item.name;
      const createdLabel = formatDate(item.created_at);
      const updatedLabel = formatDate(item.updated_at);
      currentDatesEl.textContent = [
          createdLabel ? `Created ${createdLabel}` : null,
          updatedLabel ? `Modified ${updatedLabel}` : null,
        ]
        .filter(Boolean)
        .join(" Â· ");
      rawLinkEl.href =
        item.html_url ||
        `https://github.com/${OWNER}/${REPO}/blob/${BRANCH_FALLBACK}/${item.path}`;
      codewrap.innerHTML = `<div class="status">Loading ${escapeHtml(item.name)}â€¦</div>`;
      currentCode = "";
      
      try {
        const text = await fetchFileContent(item);
        currentCode = text;
        
        const ext = item.name.includes(".") ?
          item.name.split(".").pop().toLowerCase() :
          "";
        const lang = LANG_MAP[ext] || "none";
        
        const pre = document.createElement("pre");
        pre.className = `language-${lang}`;
        const code = document.createElement("code");
        code.className = `language-${lang}`;
        code.textContent = text;
        pre.appendChild(code);
        
        codewrap.innerHTML = "";
        codewrap.appendChild(pre);
        if (lang !== "none") {
          try {
            Prism.highlightElement(code);
          } catch (e) {
            // Highlighting is best-effort; raw text is already visible.
          }
        }
        linkifyCode(code);
        addLineNumbers(pre, text);
        
        stack.push({ __file: true });
      } catch (err) {
        codewrap.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.style.padding = "8px";
        wrap.appendChild(
          errorStatus(err.message || "Couldn't load this file.", () =>
            openFile(item),
          ),
        );
        codewrap.appendChild(wrap);
      }
    }
    
    // ---- LeetCode problem-number search ----
    // Code Search (/search/code) requires auth and is blocked by CORS in
    // the browser. Instead: one recursive git-tree request, then scan
    // file heads from raw.githubusercontent.com (CORS-friendly, no token).
    const INDEX_STORAGE_KEY = "gh_problem_index_v2";
    const PROBLEM_NO_RES = [
      /leet\s*code\s*(?:problem\s*)?(?:no\.?|nos\.?|number|#)?\s*:?\s*(\d+)/gi,
      /problem\s*(?:no\.?|nos\.?|number|#)\s*:?\s*(\d+)/gi,
      /\bLC\s*#?\s*:?\s*(\d+)/gi,
    ];
    
    function extractProblemNumbers(text) {
      const nums = new Set();
      const head = text.slice(0, 4000);
      for (const re of PROBLEM_NO_RES) {
        re.lastIndex = 0;
        let m;
        while ((m = re.exec(head)) !== null) nums.add(m[1]);
      }
      return [...nums];
    }
    const INDEX_CONCURRENCY = 8;
    let problemIndex = null; // { sha, files: [{ name, path, problemNos }] }
    let lastSearchQuery = "";
    let lastSearchResults = [];
    
    function openSearchPanel() {
      searchPanel.classList.add("show");
      searchToggleBtn.classList.add("active");
      searchInput.focus();
    }
    
    function closeSearchPanel() {
      searchPanel.classList.remove("show");
      searchToggleBtn.classList.remove("active");
    }
    
    searchToggleBtn.addEventListener("click", () => {
      if (searchPanel.classList.contains("show")) {
        closeSearchPanel();
      } else {
        openSearchPanel();
      }
    });
    searchCloseBtn.addEventListener("click", closeSearchPanel);
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        triggerSearch();
      } else if (e.key === "Escape") {
        closeSearchPanel();
      }
    });
    searchGoBtn.addEventListener("click", triggerSearch);
    
    function triggerSearch() {
      const num = searchInput.value.replace(/[^0-9]/g, "").trim();
      if (!num) {
        searchInput.focus();
        return;
      }
      closeSearchPanel();
      runSearch(num);
    }
    
    async function fetchRepoTree() {
      let res;
      try {
        res = await fetchWithTimeout(
          `${API}/git/trees/${encodeURIComponent(BRANCH_FALLBACK)}?recursive=1`, { headers: authHeaders({ Accept: "application/vnd.github+json" }) },
        );
      } catch (err) {
        if (err.name === "AbortError") {
          throw new Error("Request timed out â€” check your connection.");
        }
        throw new Error("Couldn't reach GitHub. Check your connection.");
      }
      if (!res.ok) {
        if (res.status === 403 || res.status === 429) {
          throw new Error("Too many requests right now â€” try again shortly.");
        }
        if (res.status === 404) throw new Error("Couldn't find that.");
        throw new Error(`Something went wrong (${res.status}).`);
      }
      return res.json();
    }
    
    async function mapPool(items, limit, fn) {
      const results = new Array(items.length);
      let next = 0;
      async function worker() {
        while (next < items.length) {
          const i = next++;
          results[i] = await fn(items[i]);
        }
      }
      const n = Math.min(limit, items.length);
      await Promise.all(Array.from({ length: n }, () => worker()));
      return results;
    }
    
    function readCachedIndex() {
      try {
        const cached = JSON.parse(
          localStorage.getItem(INDEX_STORAGE_KEY) || "null",
        );
        if (cached && cached.sha && Array.isArray(cached.files)) return cached;
      } catch (e) {
        // ignore bad cache
      }
      return null;
    }
    
    async function ensureProblemIndex(onProgress) {
      if (problemIndex) return problemIndex;
      
      const tree = await fetchRepoTree();
      const cached = readCachedIndex();
      if (cached && cached.sha === tree.sha) {
        problemIndex = cached;
        return problemIndex;
      }
      
      const blobs = (tree.tree || []).filter((node) => {
        if (node.type !== "blob") return false;
        const name = node.path.split("/").pop();
        if (HIDDEN_PATTERNS.some((re) => re.test(name))) return false;
        const ext = name.includes(".") ?
          name.split(".").pop().toLowerCase() :
          "";
        return SEARCHABLE_EXT.has(ext);
      });
      
      if (onProgress) onProgress(0, blobs.length);
      
      let done = 0;
      const files = [];
      await mapPool(blobs, INDEX_CONCURRENCY, async (node) => {
        try {
          const res = await fetchWithTimeout(rawFileUrl(node.path));
          if (!res.ok) return;
          const text = await res.text();
          const problemNos = extractProblemNumbers(text);
          if (problemNos.length) {
            files.push({
              name: node.path.split("/").pop(),
              path: node.path,
              problemNos,
            });
          }
        } catch (e) {
          // skip files that fail to load
        } finally {
          done += 1;
          if (onProgress) onProgress(done, blobs.length);
        }
      });
      
      problemIndex = { sha: tree.sha, files };
      try {
        localStorage.setItem(INDEX_STORAGE_KEY, JSON.stringify(problemIndex));
      } catch (e) {
        // quota / private mode
      }
      return problemIndex;
    }
    
    async function runSearch(num) {
      showList();
      stack.push({ __search: true });
      backBtn.classList.add("show");
      crumbEl.textContent = "Search results";
      titleEl.textContent = `LeetCode #${num}`;
      renderSkeleton();
      lastSearchQuery = num;
      try {
        const index = await ensureProblemIndex((done, total) => {
          if (!total) return;
          titleEl.textContent = `Indexing filesâ€¦ ${done}/${total}`;
        });
        lastSearchResults = index.files.filter((item) =>
          (item.problemNos || []).includes(String(num)),
        );
        renderSearchResults(num, lastSearchResults);
      } catch (err) {
        titleEl.textContent = `LeetCode #${num}`;
        listView.innerHTML = "";
        listView.appendChild(
          errorStatus(err.message || "Couldn't search right now.", () =>
            runSearch(num),
          ),
        );
      }
    }
    
    function renderSearchResults(num, items) {
      showList();
      // The floating folder toolbar doesn't apply to search results.
      listActionsBar.innerHTML = "";
      listActionsBar.classList.add("hidden");
      listView.classList.remove("has-actions");
      crumbEl.textContent = "Search results";
      titleEl.textContent = `LeetCode #${num}`;
      backBtn.classList.add("show");
      if (!items.length) {
        listView.innerHTML = `<div class="empty"><span class="empty-icon">${icon("emptyFolder", 30)}</span>No files tagged with LeetCode problem #${escapeHtml(num)}.</div>`;
        return;
      }
      const list = document.createElement("div");
      list.className = "card-list";
      items.forEach((item, i) => {
        const row = document.createElement("div");
        row.className = "row";
        row.style.animationDelay = `${Math.min(i, 10) * 18}ms`;
        const dirPath = item.path.split("/").slice(0, -1).join(" / ");
        row.innerHTML = `
          <div class="badge">${fileIconHtml(item.name)}</div>
          <div class="row-info">
            <div class="row-name">${escapeHtml(item.name)}</div>
            <div class="row-sub">${dirPath ? escapeHtml(dirPath) : OWNER}<span class="dot">Â·</span><span class="result-tag">${icon("search", 11)} #${escapeHtml(num)}</span></div>
          </div>
          <div class="row-chev">${icon("chevron", 15)}</div>`;
        row.addEventListener("click", () => openSearchResult(item));
        list.appendChild(row);
      });
      listView.innerHTML = "";
      listView.appendChild(list);
    }
    
    async function openSearchResult(item) {
      await openFile({
        name: item.name,
        path: item.path,
        download_url: rawFileUrl(item.path),
        html_url: `https://github.com/${OWNER}/${REPO}/blob/${BRANCH_FALLBACK}/${item.path}`,
      });
    }
    // ---- end search ----
    
    backBtn.addEventListener("click", () => {
      if (stack.length <= 1) return;
      const leavingCompose =
        composeState && !isComposeClean() ? confirmDiscardCompose() : false;
      if (leavingCompose) return; // dialog takes over
      stack.pop();
      const top = stack[stack.length - 1];
      composeState = null;
      closeModal();
      if (typeof top === "string") {
        renderFolder(top);
      } else if (top && top.__search) {
        renderSearchResults(lastSearchQuery, lastSearchResults);
      } else if (top && top.__file) {
        renderFolder("");
      }
    });
    
    // ---- Compose wiring ----
    // "Clean" means nothing worth losing: the text, path and message all still
    // hold their opening values, so leaving can't discard real work.
    function isComposeClean() {
      if (!composeState) return true;
      const originalMessage = suggestCommitMessage(
        composeState.mode,
        composeState.originalPath || "file",
      );
      return (
        editorEl.value === composeState.content &&
        normalizeRepoPath(fileNameInput.value) === composeState.originalPath &&
        commitMessageInput.value.trim() === originalMessage &&
        !commitDescInput.value.trim()
      );
    }
    
    function confirmDiscardCompose() {
      if (!composeState || isComposeClean()) return false;
      openModal({
        title: "Discard changes?",
        danger: true,
        body: [
          modalText(
            "You have unsaved edits. Leaving now loses them â€” nothing has been committed.",
          ),
        ],
        confirmLabel: "Discard",
        onConfirm: () => {
          composeState = null;
          closeModal();
          if (stack.length > 1) stack.pop();
          const top = stack[stack.length - 1];
          if (typeof top === "string") renderFolder(top);
          else if (top && top.__search) {
            renderSearchResults(lastSearchQuery, lastSearchResults);
          } else renderFolder("");
        },
      });
      return true;
    }
    
    saveFileBtn.addEventListener("click", handleCommitClick);
    cancelEditBtn.addEventListener("click", () => {
      const blocked = confirmDiscardCompose();
      if (blocked) return;
      composeState = null;
      composeGoBack();
    });
    deleteFileBtn.addEventListener("click", () => {
      if (!composeState || composeState.mode !== "update") return;
      confirmAndDeleteFile({
        path: composeState.path,
        sha: composeState.sha,
        message: commitMessageInput.value.trim() ||
          suggestCommitMessage("delete", composeState.path),
        onDone: () => {
          composeState = null;
          composeGoBack();
        },
        onError: (msg) => composeStatus(msg, "error"),
      });
    });
    
    // Ctrl/Cmd+S commits; Escape backs out of the composer.
    document.addEventListener("keydown", (e) => {
      if (!composeState) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        handleCommitClick();
      }
    });
    
    commitMessageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleCommitClick();
      }
    });
    
    // Keep the header in sync while the path is typed.
    fileNameInput.addEventListener("input", () => {
      if (composeState) updateComposePreview();
    });
    
    // Ctrl/Cmd+Enter always commits, even from inside the editor.
    editorEl.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        handleCommitClick();
        return;
      }
      // Keep tab-indentation inside the editor instead of moving focus.
      if (e.key === "Tab") {
        e.preventDefault();
        const start = editorEl.selectionStart;
        const end = editorEl.selectionEnd;
        editorEl.setRangeText("  ", start, end, "end");
      }
    });
    
    // ---- Code / image view write actions ----
    editBtn.addEventListener("click", () => {
      if (!currentFileItem) return;
      startEditExistingFile(currentFileItem);
    });
    
    deleteBtn.addEventListener("click", () => {
      if (!currentFileItem) return;
      const item = currentFileItem;
      confirmAndDeleteFile({
        path: item.path,
        sha: item.sha,
        onDone: () => {
          stack.pop();
          const top = stack[stack.length - 1];
          renderFolder(typeof top === "string" ? top : parentPath(item.path));
        },
      });
    });
    
    imageDeleteBtn.addEventListener("click", () => {
      if (!currentImageItem) return;
      const item = currentImageItem;
      confirmAndDeleteFile({
        path: item.path,
        sha: item.sha,
        onDone: () => {
          stack.pop();
          const top = stack[stack.length - 1];
          renderFolder(typeof top === "string" ? top : parentPath(item.path));
        },
      });
    });
    
    newFileBtn.addEventListener("click", () => {
      const top = stack[stack.length - 1];
      startNewFile(typeof top === "string" ? top : "");
    });
    
    window.addEventListener("error", (e) => {
      // Swallow stray script errors (e.g. from CDN hiccups) so the UI
      // doesn't get stuck on a blank screen.
      console.error("Unhandled error:", e.error || e.message);
    });
    
    // Show/hide the write affordances for whatever token is already stored.
    refreshWriteAffordances();
    
    renderFolder("");
  </script>
</body>
